<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>file</title>
<style>
  /* No design. The browser's defaults are what an autoindex looks like, and a video is the page. */
  body { margin: 8px; }
  body.media { margin: 0; background: #000; height: 100vh; overflow: hidden; }
  body.media video { display: block; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  body.media audio { display: block; margin: 40vh auto 0; width: min(720px, 90vw); }
  body.media .status { display: none; }
  
  body.media > header, body.media > #kind, body.media > #meta { display: none; }
  
  body.plain > header, body.plain > #kind, body.plain > #meta, body.plain .status { display: none; }
  body.plain { margin: 0; }
  body.plain pre { padding: 0; margin: 0; }
  body.media #stage { height: 100vh; margin: 0; }
  img { max-width: 100%; max-height: calc(100vh - 40px); }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  table { border-collapse: collapse; }
  .status { margin: 6px 0 0; font-size: 12px; }
  .status.error { color: #b42318; }
</style>
</head>
<body>
<header id="where">file</header><div id="kind"></div><div id="meta"></div>
<main id="stage">
  <p class="empty">Open a file by name: <code>file#yakusoku.mp4</code>, <code>file#notes.txt</code>, <code>file#something.zip</code>.</p>
</main>
<script>
'use strict';
// file.html — the renderer. No encoder, no tabs, no options: an address in, the thing rendered.
//
//   file#yakusoku.mp4      → the player is on screen at once; the service worker (b2p-stream.js)
//                            answers byte ranges from the parts, so only what plays is fetched
//   file#textfile.txt      → the bytes are fetched and the text is printed
//   file#something.zip     → the LAST part only is fetched, the EOCD names every member, and the
//                            page shows an "Index of …" with a Download Zip and per-file downloads
//                            (a member is fetched by its own byte range, never the whole archive)
//
// A name is resolved through IDSDICTIONARY.txt, the same keyring bin2png.html uses: sha256(name)
// finds the line, the name decrypts the pbs id on it. A bare pbs id, a full https url, and a
// `id1+id2` list are accepted too, so a link works even for a file that was never named.
const CAPACITY = 899 * 898 * 3;          // bytes per PNG part, exactly as the encoder cuts it
const IDS_DICT_FILE = 'IDSDICTIONARY.txt';
const IDS_VERSION = 'v1';
const IDS_ITERATIONS = 100000, IDS_IV = 12, IDS_TAG = 16;
const PACK_MAGIC = [0x42, 0x32, 0x50, 0x5A];   // "B2PZ": the page's DEFLATE wrapper
const PACK_HEADER = 9;

const $ = (id) => document.getElementById(id);
const stage = $('stage');
const statusEl = document.createElement('p');

function fmt(n) {
  if (!Number.isFinite(n)) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(2) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}
function status(text, bad) {
  statusEl.className = 'status' + (bad ? ' error' : '');
  statusEl.textContent = text || '';
}
function clearStage() {
  stage.textContent = '';
  stage.appendChild(statusEl);
}
function hex(n, w = 2) { return n.toString(16).padStart(w, '0'); }

// ─── the name keyring (same format as bin2png.html / idsdictionary.py) ────────────────────────
async function sha256(bytes) {
  const d = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(d)].map((b) => hex(b)).join('');
}
function b64uDecode(text) {
  const s = String(text).replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(s + '='.repeat((4 - (s.length % 4)) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function idsKey(name) {
  const secret = new TextEncoder().encode(name);
  const salt = new Uint8Array(await crypto.subtle.digest('SHA-256', secret));
  const base = await crypto.subtle.importKey('raw', secret, 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt, iterations: IDS_ITERATIONS, hash: 'SHA-256' }, base, 256);
  return new Uint8Array(bits);
}
async function idsHmac(key, data) {
  const k = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC', k, data));
}
async function idsXor(key, iv, data) {
  const out = new Uint8Array(data.length);
  let counter = 0, at = 0;
  while (at < data.length) {
    const block = new Uint8Array(iv.length + 4);
    block.set(iv, 0);
    new DataView(block.buffer).setUint32(iv.length, counter, false);
    const ks = await idsHmac(key, block);
    for (let i = 0; i < ks.length && at < data.length; i++, at++) out[at] = data[at] ^ ks[i];
    counter++;
  }
  return out;
}
async function idsDecrypt(name, payloadB64) {
  const raw = b64uDecode(payloadB64);
  if (raw.length < IDS_IV + IDS_TAG) throw new Error('the record is too short to hold an iv and a tag');
  const iv = raw.subarray(0, IDS_IV);
  const ct = raw.subarray(IDS_IV, raw.length - IDS_TAG);
  const tag = raw.subarray(raw.length - IDS_TAG);
  const key = await idsKey(name);
  const buf = new Uint8Array(iv.length + ct.length);
  buf.set(iv, 0); buf.set(ct, iv.length);
  const want = (await idsHmac(key, buf)).subarray(0, IDS_TAG);
  let same = tag.length === want.length;
  for (let i = 0; same && i < tag.length; i++) same = tag[i] === want[i];
  if (!same) throw new Error('the tag does not check — this name is not the key for that record');
  return new TextDecoder().decode(await idsXor(key, iv, ct));
}
let dictCache = null;
async function dictionary() {
  if (dictCache) return dictCache;
  const url = new URL(IDS_DICT_FILE, location.href).href;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`no ${IDS_DICT_FILE} next to this page (HTTP ${res.status}) — looked at ${url}`);
  const map = new Map();
  for (const line of (await res.text()).split('\n')) {
    const t = line.trim();
    if (!t || t.startsWith('#')) continue;
    const p = t.split(/\s+/);
    if (p.length === 3 && p[0] === IDS_VERSION) map.set(p[1], p[2]);
  }
  dictCache = map;
  return map;
}

// ─── address → the parts that hold the payload ─────────────────────────────────────────────────
const PBS_ID = /^[A-Za-z0-9_-]{10,}$/;
const IDS_ID_PREFIX = /^id:/i;
const IDS_NAME_PREFIX = /^(?:n|name):/i;

function isNameToken(tok) {
  const t = String(tok || '').trim();
  if (!t || /^https?:/i.test(t) || IDS_ID_PREFIX.test(t)) return false;
  if (IDS_NAME_PREFIX.test(t)) return true;
  return /\./.test(t) && !PBS_ID.test(t);
}
function pbsUrls(plain) {
  const t = String(plain || '').trim();
  if (!t) throw new Error('the record decrypted to nothing');
  // Split FIRST, then decide per part: a record may be `id+id` or a list of full urls, and the
  // whole string starting with http does not make it ONE url.
  return t.split('+').map((k) => k.trim()).filter(Boolean).map((part) => {
    if (/^https?:/i.test(part)) return part;
    if (!/^[A-Za-z0-9_-]+$/.test(part)) {
      throw new Error(`the record holds something that is not a pbs id: ${part.slice(0, 24)}`);
    }
    return `https://pbs.twimg.com/media/${part}?format=png`;
  });
}

// One token → { name, urls }. `name` is what the address called it (used as the file name).
async function resolveToken(token) {
  const t = String(token || '').trim();
  if (!t) throw new Error('empty address');
  if (/^https?:/i.test(t)) return { name: decodeURIComponent(t.split('/').pop().split('?')[0]) || 'file', urls: [t] };
  if (IDS_ID_PREFIX.test(t)) {
    const id = t.replace(IDS_ID_PREFIX, '').trim();
    // `pbsUrls(id)`, never `pbsUrls(t)`: the token still carried the `id:` prefix, so every part
    // failed the pbs-id test and `file#id:<anything>` answered "the record holds something that is
    // not a pbs id: id:http:" — found 2026-10-19 by the dot-address check.
    if (PBS_ID.test(id)) return { name: id, urls: pbsUrls(id) };
    return { name: id, urls: pbsUrls(id) };
  }
  if (isNameToken(t)) {
    const name = t.replace(IDS_NAME_PREFIX, '');
    const hash = await sha256(new TextEncoder().encode(name));
    const record = (await dictionary()).get(hash);
    if (!record) throw new Error(`${name} is not in ${IDS_DICT_FILE} (its hash starts ${hash.slice(0, 12)}…)`);
    return { name, urls: pbsUrls(await idsDecrypt(name, record)) };
  }
  // Bare ids, `id1+id2`, or a pbs url — no name, so the address is only an id.
  const list = t.split('+').map((s) => s.trim()).filter(Boolean);
  const urls = [];
  let name = null;
  for (const part of list) {
    const m = part.match(/pbs\.twimg\.com\/media\/([A-Za-z0-9_-]+)/) || part.match(/^([A-Za-z0-9_-]{10,})$/);
    if (!m) throw new Error(`cannot read "${part}" as a name, a pbs id, or a url`);
    urls.push(`https://pbs.twimg.com/media/${m[1]}?format=png`);
    name = name || m[1];
  }
  return { name, urls };
}

// ─── the codec ────────────────────────────────────────────────────────────────────────────────
async function decodePngExact(bytes) {
  if (!(bytes && bytes.length > 33 && bytes[0] === 0x89 && bytes[1] === 0x50)) return null;
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let off = 8, w = 0, h = 0, depth = 0, color = 0, interlace = 0, plte = null, trns = null;
  const idat = [];
  while (off + 8 <= bytes.length) {
    const len = dv.getUint32(off);
    const type = String.fromCharCode(bytes[off + 4], bytes[off + 5], bytes[off + 6], bytes[off + 7]);
    const start = off + 8;
    if (type === 'IHDR') {
      w = dv.getUint32(start); h = dv.getUint32(start + 4);
      depth = bytes[start + 8]; color = bytes[start + 9]; interlace = bytes[start + 12];
    } else if (type === 'PLTE') plte = bytes.subarray(start, start + len);
    else if (type === 'tRNS') trns = bytes.subarray(start, start + len);
    else if (type === 'IDAT') idat.push(bytes.subarray(start, start + len));
    else if (type === 'IEND') break;
    off = start + len + 4;
  }
  const palette = color === 3 && depth === 8 && plte && plte.length >= 3;
  if (depth !== 8 || interlace !== 0 || !w || !h || !idat.length) return null;
  if (color !== 6 && !palette) return null;
  const zip = new Uint8Array(idat.reduce((n, c) => n + c.length, 0));
  let z = 0;
  for (const c of idat) { zip.set(c, z); z += c.length; }
  const raw = new Uint8Array(await new Response(
    new Blob([zip]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
  const bpp = palette ? 1 : 4, stride = w * bpp;
  if (raw.length < h * (stride + 1)) return null;
  const px = new Uint8Array(h * stride);
  let p = 0;
  for (let y = 0; y < h; y++) {
    const f = raw[p++], row = y * stride, prev = row - stride;
    for (let x = 0; x < stride; x++) {
      const a = x >= bpp ? px[row + x - bpp] : 0;
      const b = y > 0 ? px[prev + x] : 0;
      const c = (x >= bpp && y > 0) ? px[prev + x - bpp] : 0;
      let v = raw[p++];
      if (f === 1) v += a;
      else if (f === 2) v += b;
      else if (f === 3) v += (a + b) >> 1;
      else if (f === 4) {
        const pp = a + b - c, pa = Math.abs(pp - a), pb = Math.abs(pp - b), pc = Math.abs(pp - c);
        v += (pa <= pb && pa <= pc) ? a : (pb <= pc ? b : c);
      }
      px[row + x] = v & 0xff;
    }
  }
  const out = [];
  if (!palette) {
    for (let i = 0; i < px.length; i += 4) {
      const alpha = px[i + 3];
      if (alpha === 0) break;
      if (alpha === 255) out.push(px[i], px[i + 1], px[i + 2]);
      else if (alpha === 170) out.push(px[i], px[i + 1]);
      else if (alpha === 85) out.push(px[i]);
    }
  } else {
    for (let i = 0; i < px.length; i++) {
      const idx = px[i];
      const a = trns && idx < trns.length ? trns[idx] : 255;
      if (a === 0) break;
      const at = idx * 3;
      out.push(plte[at]);
      if (a >= 255 || (a !== 170 && a !== 85)) out.push(plte[at + 1], plte[at + 2]);
      else if (a === 170) out.push(plte[at + 1]);
    }
  }
  return new Uint8Array(out);
}
function concat(list) {
  const out = new Uint8Array(list.reduce((n, b) => n + b.length, 0));
  let at = 0;
  for (const b of list) { out.set(b, at); at += b.length; }
  return out;
}
function isPacked(bytes) {
  return !!(bytes && bytes.length > PACK_HEADER && PACK_MAGIC.every((m, i) => bytes[i] === m) && bytes[4] === 1);
}
async function inflate(comp, format) {
  return new Uint8Array(await new Response(
    new Blob([comp]).stream().pipeThrough(new DecompressionStream(format))).arrayBuffer());
}
// A PREFIX of a packed payload still inflates to a prefix of the file: every complete DEFLATE block
// comes out before the truncation error, and the first 64 KB of the real file is all a sniff needs.
// `unpackPayload` cannot be used for this — it wants the whole stream to prove the recorded length.
async function unpackPrefix(bytes) {
  if (!isPacked(bytes)) return null;
  const chunks = [];
  let total = 0;
  try {
    const reader = new Blob([bytes.subarray(PACK_HEADER)]).stream()
      .pipeThrough(new DecompressionStream('deflate')).getReader();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value && value.length) { chunks.push(value); total += value.length; }
    }
  } catch (e) { /* truncated: keep what came through */ }
  if (!total) return null;
  const out = new Uint8Array(total);
  let at = 0;
  for (const c of chunks) { out.set(c, at); at += c.length; }
  return out;
}

async function unpackPayload(bytes) {
  if (!isPacked(bytes)) return bytes;
  try {
    const want = new DataView(bytes.buffer, bytes.byteOffset).getUint32(5);
    const out = await inflate(bytes.subarray(PACK_HEADER), 'deflate');
    return out.length === want ? out : bytes;
  } catch (e) { return bytes; }
}

// ─── the bytes: a part list, or one ordinary url (then HTTP ranges do the work) ───────────────
let src = { name: '', urls: [], direct: false, ranged: false };
const partCache = new Map();

async function partPayload(i) {
  if (partCache.has(i)) return partCache.get(i);
  const p = (async () => {
    const url = src.urls[i];
    const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
    if (!res.ok) throw new Error(`part ${i + 1}: HTTP ${res.status}`);
    const payload = await decodePngExact(new Uint8Array(await res.arrayBuffer()));
    if (!payload) throw new Error(`part ${i + 1} is not a bin2png PNG`);
    if (i < src.urls.length - 1 && payload.length !== CAPACITY) {
      throw new Error(`part ${i + 1} holds ${payload.length} B, not the ${CAPACITY} the file was ` +
                      'cut at — the byte offsets cannot be trusted for this payload');
    }
    return payload;
  })();
  partCache.set(i, p);
  try { return await p; } catch (e) { partCache.delete(i); throw e; }
}

async function sourceSize() {
  if (src.direct) {
    const res = await fetch(src.urls[0], { method: 'HEAD' });
    if (!res.ok) throw new Error(`HTTP ${res.status} for ${src.urls[0]}`);
    return Number(res.headers.get('Content-Length')) || 0;
  }
  const last = await partPayload(src.urls.length - 1);
  return (src.urls.length - 1) * CAPACITY + last.length;
}

// Bytes [start, end] inclusive, from the parts that actually hold them.
async function sourceRange(start, end) {
  if (end < start) return new Uint8Array(0);
  if (src.direct) {
    const res = await fetch(src.urls[0], { headers: { Range: `bytes=${start}-${end}` } });
    if (res.status !== 206) {
      // A server that answers 200 ignores Range: the body is the whole file.
      const all = new Uint8Array(await res.arrayBuffer());
      return all.subarray(start, end + 1);
    }
    return new Uint8Array(await res.arrayBuffer());
  }
  const first = Math.floor(start / CAPACITY), last = Math.floor(end / CAPACITY);
  const pieces = [];
  for (let i = first; i <= last; i++) {
    const buf = await partPayload(i);
    const base = i * CAPACITY;
    const a = Math.max(start, base) - base;
    const b = Math.min(end, base + buf.length - 1) - base;
    if (b >= a) pieces.push(buf.subarray(a, b + 1));
  }
  return concat(pieces);
}

// Every byte, in order — the path for text and small images.
async function wholeFile() {
  if (src.direct) {
    const res = await fetch(src.urls[0]);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return unpackPayload(new Uint8Array(await res.arrayBuffer()));
  }
  const parts = await Promise.all(src.urls.map((_, i) => partPayload(i)));
  return unpackPayload(concat(parts));
}

// ─── mime, by name first ─────────────────────────────────────────────────────────────────────
const MIME_BY_EXT = {
  png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp',
  bmp: 'image/bmp', mp4: 'video/mp4', webm: 'video/webm', mov: 'video/quicktime', mkv: 'video/x-matroska',
  mp3: 'audio/mpeg', ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg', flac: 'audio/flac',
  wav: 'audio/wav', m4a: 'audio/mp4',
  txt: 'text/plain', json: 'application/json', html: 'text/html', css: 'text/css',
  js: 'text/javascript', md: 'text/markdown', csv: 'text/csv', xml: 'application/xml',
  sh: 'text/x-shellscript', py: 'text/x-python',
  zip: 'application/zip', gz: 'application/gzip', bz2: 'application/x-bzip2', xz: 'application/x-xz',
  '7z': 'application/x-7z-compressed', rar: 'application/x-rar-compressed', tar: 'application/x-tar',
  pdf: 'application/pdf', apk: 'application/vnd.android.package-archive',
};
function mimeFromName(name) {
  const ext = (String(name || '').match(/\.([A-Za-z0-9]+)$/) || [])[1];
  return (ext && MIME_BY_EXT[ext.toLowerCase()]) || '';
}
function saveBytes(bytes, name, mime) {
  const blob = new Blob([bytes], { type: 'application/octet-stream' });   // a save, never a player
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name || 'file.bin';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

// ─── the player, through the range worker ────────────────────────────────────────────────────
const STREAM_PLAN_CACHE = 'b2p-plan-v1';
const STREAM_SCRIPT = 'b2p-stream.js';
let streamWorker = null;

function streamScriptUrl() { return new URL(STREAM_SCRIPT, location.href); }
function ensureStreamWorker() {
  if (streamWorker) return streamWorker;
  if (!('serviceWorker' in navigator) || !window.isSecureContext) return Promise.resolve(null);
  streamWorker = (async () => {
    try {
      const reg = await navigator.serviceWorker.register(streamScriptUrl().href);
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller) {
        await new Promise((res) => {
          const t = setTimeout(res, 2500);
          navigator.serviceWorker.addEventListener('controllerchange', () => { clearTimeout(t); res(); }, { once: true });
        });
      }
      return navigator.serviceWorker.controller ? reg : null;
    } catch (e) { return null; }
  })();
  return streamWorker;
}
async function streamUrlFor(name, urls, mime) {
  const reg = await ensureStreamWorker();
  if (!reg || src.direct || urls.length === 0) return null;
  const id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const plan = { id, name, mime, cap: CAPACITY, parts: urls, total: 0 };
  try {
    const cache = await caches.open(STREAM_PLAN_CACHE);
    await cache.put(new URL('__b2p/plan/' + id, streamScriptUrl()).href, new Response(JSON.stringify(plan), {
      headers: { 'Content-Type': 'application/json' },
    }));
  } catch (e) { return null; }
  // The URL carries the plan in a form a NEW browser can use: `p=` are pbs ids (the common case),
  // `u=` full urls (a fixture, or any other host), `m=` the type. So copying the address of a
  // playing video, or opening a shared one, still streams — the worker does not need this page's
  // Cache API entry (404.html relies on exactly that).
  const q = new URLSearchParams({ id });
  const ids = urls.map((u) => (u.match(/pbs\.twimg\.com\/media\/([A-Za-z0-9_-]+)/) || [])[1]);
  if (ids.length === urls.length && ids.every(Boolean)) q.set('p', ids.join('+'));
  else q.set('u', urls.map((u) => encodeURIComponent(u)).join('|'));
  if (mime) q.set('m', mime);
  return new URL('__b2p/' + encodeURIComponent(name) + '?' + q.toString(), streamScriptUrl()).href;
}

// `mime` is the type the router already resolved — from the name, or from the probe when the
// address had no extension. Re-deriving it here is what made `clip.dat` (a sniffed mp4) come out as
// an <audio> element.
// The first bytes of the payload, cheaply: enough to tell a manifest from a media container.
async function peekHead(n = 64) {
  try {
    if (src.direct) return await sourceRange(0, n - 1);
    const ends = await rangedEnds();
    return ends ? ends.head.subarray(0, n) : null;
  } catch (e) { return null; }
}
function isManifestHead(bytes) {
  if (!bytes || bytes.length < 20) return false;
  const t = new TextDecoder('latin1').decode(bytes.subarray(0, 20));
  return t.startsWith('#bin2png-manifest');
}

async function renderMedia(mime) {
  mime = mime || 'application/octet-stream';
  // A NAME can lie, and a master file always does: `file/blindspots.webm` is a .webm by name and a
  // manifest by content (his 2026-10-19 report — it errored). Look at the first bytes first.
  if (manifestDepth < 1 && isManifestHead(await peekHead())) {
    const master = followManifest(await wholeFile());
    if (master) {
      manifestDepth++;
      src = { ...src, name: master.name, urls: master.urls };
      partCache.clear();
      stage.textContent = '';
      stage.appendChild(statusEl);
      return renderMedia(mimeFromName(master.name) || '');
    }
  }
  const isVideo = mime.startsWith('video/');
  const el = document.createElement(isVideo ? 'video' : 'audio');
  el.controls = true;
  el.autoplay = true;
  el.playsInline = true;

  // Following a master lands here with NEW parts and no sniff of its own: check whether what it
  // names is PACKED before offering it to a player (a packed webm otherwise went black for 23 s).
  if (!src.direct && !src.packed) {
    const h = await peekHead(16);
    if (h && isPacked(h)) src.packed = true;
  }
  if (src.direct) {
    // An ordinary url is already streamable by the browser: point at it and let it do the work.
    el.src = src.urls[0];
    status(`Playing ${src.urls[0]}`);
  } else {
    // A PACKED payload (B2PZ) is a deflate stream: byte N of the file is not at byte N of the
    // payload, so a player reading ranges gets compressed bytes and dies. Fetch and unpack instead.
    const url = src.packed ? null : await streamUrlFor(src.name, src.urls, mime);
    if (url) {
      el.src = url;
      status(`${src.urls.length} part(s) — byte-range streaming: the player fetches only what it reads`);
    } else {
      status('Fetching every part, then playing (no range worker on this origin)…');
      const bytes = await wholeFile();
      el.src = URL.createObjectURL(new Blob([bytes], { type: mime }));
      $('meta').textContent = fmt(bytes.length);
      status(`${fmt(bytes.length)} — ${src.urls.length} part(s)`);
    }
  }
  document.body.className = 'media';
  el.addEventListener('loadedmetadata', () => {
    if (Number.isFinite(el.duration) && el.duration) $('meta').textContent = `${Math.round(el.duration)}s`;
    status('');
  });
  stage.appendChild(el);
  return el;
}

// ─── zip: the directory lives at the end, so only the tail is fetched ─────────────────────────
const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
const u64 = (b, o) => u32(b, o) + u32(b, o + 4) * 4294967296;

function findEocd(buf) {
  for (let i = buf.length - 22; i >= 0; i--) if (u32(buf, i) === 0x06054b50) return i;
  return -1;
}

// Parse the central directory from `block`, whose byte 0 is absolute offset `at`.
async function readZipCentral() {
  if (src.direct) return readZipCentralDirect();
  const n = src.urls.length;
  let last = await partPayload(n - 1);
  // The EOCD is in the last 22 bytes plus a comment of at most 65535 — grow the tail backwards
  // until the record is inside it (a small last part happens when the file cut lands near the end).
  let block = last, at = (n - 1) * CAPACITY, from = n - 2;
  let eocd = findEocd(block);
  while (eocd < 0 && from >= 0 && block.length < 70000) {
    const prev = await partPayload(from--);
    block = concat([prev, block]);
    at -= prev.length;
    eocd = findEocd(block);
  }
  if (eocd < 0) throw new Error('no zip end-of-directory record in the last part');
  const total = at + block.length;
  let entries = u16(block, eocd + 10);
  let cdSize = u32(block, eocd + 12);
  let cdOff = u32(block, eocd + 16);
  if (entries === 0xffff || cdSize === 0xffffffff || cdOff === 0xffffffff) {
    // ZIP64: a locator just before the EOCD points at the real record.
    let loc = -1;
    for (let i = eocd - 20; i >= 0; i--) if (u32(block, i) === 0x07064b50) { loc = i; break; }
    if (loc >= 0) {
      const z64 = u64(block, loc + 8);
      const zoff = z64 - at;
      if (zoff >= 0 && zoff + 56 <= block.length && u32(block, zoff) === 0x06064b50) {
        entries = u64(block, zoff + 32);
        cdSize = u64(block, zoff + 40);
        cdOff = u64(block, zoff + 48);
      } else throw new Error('this zip is ZIP64 and its directory is further back than one part');
    } else throw new Error('this zip is ZIP64 with no locator in the tail');
  }
  // The directory may start before the tail that was read: fetch exactly the parts that hold it.
  if (cdOff < at) {
    const first = Math.floor(cdOff / CAPACITY);
    const pieces = [];
    for (let i = first; i < n; i++) pieces.push(await partPayload(i));
    block = concat(pieces);
    at = first * CAPACITY;
  }
  return parseCentral(block, at, entries, cdSize, cdOff, total);
}

// A zip behind one ordinary url: ask the server for the tail, then for the directory, with ranges.
const ZIP_TAIL = 65557;
async function readZipCentralDirect() {
  const total = await sourceSize();
  if (!total) throw new Error('this server does not report a size, so the zip tail cannot be located');
  const tailStart = Math.max(0, total - ZIP_TAIL - 22);
  let block = await sourceRange(tailStart, total - 1);
  let at = tailStart;
  let eocd = findEocd(block);
  if (eocd < 0) throw new Error('no zip end-of-directory record in the last 64 KB');
  let entries = u16(block, eocd + 10);
  let cdSize = u32(block, eocd + 12);
  let cdOff = u32(block, eocd + 16);
  if (entries === 0xffff || cdSize === 0xffffffff || cdOff === 0xffffffff) {
    let loc = -1;
    for (let i = eocd - 20; i >= 0; i--) if (u32(block, i) === 0x07064b50) { loc = i; break; }
    if (loc >= 0) {
      const z64 = u64(block, loc + 8);
      const dir = await sourceRange(z64, z64 + 55);
      if (u32(dir, 0) === 0x06064b50) {
        entries = u64(dir, 32); cdSize = u64(dir, 40); cdOff = u64(dir, 48);
      }
    }
  }
  if (cdOff < at) {
    block = await sourceRange(cdOff, Math.min(total - 1, cdOff + cdSize + 64));
    at = cdOff;
  }
  return parseCentral(block, at, entries, cdSize, cdOff, total);
}

// ─── when the address says nothing: read the two ENDS, never the whole file ───────────────────
// A name carries its type; an id does not. So for an unnamed payload the page reads the LAST part
// (a zip's directory is there) and the FIRST part (a container's magic bytes). Two parts at most,
// and neither is wasted: the tail is what the listing needs and the head is what the player
// starts with.
function sniffMime(head) {
  const b = head;
  const at = (i, ...sig) => sig.every((v, k) => b[i + k] === v);
  if (b.length > 12 && at(4, 0x66, 0x74, 0x79, 0x70)) return 'video/mp4';       // …ftyp
  // EBML covers BOTH .webm and .mkv, and the element will not play a blob labelled
  // video/x-matroska even when the bytes are a webm. The DocType in the header says which it is.
  if (at(0, 0x1a, 0x45, 0xdf, 0xa3)) {
    const head = new TextDecoder('latin1').decode(b.subarray(0, Math.min(64, b.length)));
    return /webm/i.test(head) ? 'video/webm' : 'video/x-matroska';
  }
  if (at(0, 0x89, 0x50, 0x4e, 0x47)) return 'image/png';
  if (at(0, 0xff, 0xd8, 0xff)) return 'image/jpeg';
  if (at(0, 0x47, 0x49, 0x46, 0x38)) return 'image/gif';
  if (at(0, 0x52, 0x49, 0x46, 0x46) && b.length > 11) return 'image/webp';
  if (at(0, 0x25, 0x50, 0x44, 0x46)) return 'application/pdf';
  if (at(0, 0x49, 0x44, 0x33)) return 'audio/mpeg';
  if (at(0, 0x4f, 0x67, 0x67, 0x53)) return 'audio/ogg';
  if (at(0, 0x66, 0x4c, 0x61, 0x43)) return 'audio/flac';
  // Text: no control bytes in the first 4 KB (tab/newline/cr are fine) and something printable.
  const sample = b.subarray(0, Math.min(4096, b.length));
  let ctrl = 0, printable = 0;
  for (const c of sample) {
    if (c === 9 || c === 10 || c === 13) continue;
    if (c < 32 || c > 126) { if (c < 128) ctrl++; } else printable++;
  }
  if (sample.length && ctrl / sample.length <= 0.02 && printable > 0) {
    const s = new TextDecoder().decode(sample).trimStart();
    if (/^<(!doctype|html|\?xml)/i.test(s)) return 'text/html';
    if (/^[{[]/.test(s)) return 'application/json';
    return 'text/plain';
  }
  return '';
}

// A zip is recognised by a STRUCTURAL test, not by a signature that happens to appear: the EOCD's
// comment length has to end exactly at the last byte.
function looksLikeZipTail(tail) {
  const at = findEocd(tail);
  if (at < 0) return false;
  const comment = u16(tail, at + 20);
  if (at + 22 + comment !== tail.length) return false;
  const entries = u16(tail, at + 10);
  const cdSize = u32(tail, at + 12);
  return entries > 0 && cdSize > 0;
}

// [start, end] of the PAYLOAD, answered by the service worker: it decodes only the PNG prefix that
// carries those bytes. This is the read a `.`-prefixed address is for.
async function streamRange(planUrl, start, end) {
  if (end < start) return new Uint8Array(0);
  const res = await fetch(planUrl, { headers: { Range: `bytes=${start}-${end}` } });
  if (res.status !== 206) return null;
  return new Uint8Array(await res.arrayBuffer());
}

// The head of part 1 and the tail of the last part — the only two reads a `.`-address makes before
// it knows what the payload is. The total comes from the worker's HEAD (it decodes the last part's
// length, which it has to do once anyway to answer a range at all).
async function rangedEnds() {
  if (!src.urls.length) return null;
  const planUrl = await streamUrlFor(src.name || 'file', src.urls, 'application/octet-stream');
  if (!planUrl) return null;
  const headRes = await fetch(planUrl, { method: 'HEAD' });
  const total = Number(headRes.headers.get('Content-Length')) || 0;
  if (!total) return null;
  const head = await streamRange(planUrl, 0, Math.min(total - 1, 65535));
  const tail = await streamRange(planUrl, Math.max(0, total - 65557), total - 1);
  if (!head || !tail) return null;
  return { head, tail, total };
}

async function sniffSource() {
  if (src.direct) {
    const total = await sourceSize();
    if (!total) return { mime: '' };
    const tail = await sourceRange(Math.max(0, total - 65557), total - 1);
    if (looksLikeZipTail(tail)) return { zip: true };
    const head = await sourceRange(0, Math.min(total - 1, 65535));
    // A packed payload (the encoder's DEFLATE wrapper) hides its type; unpack when the head is
    // enough for it, which it always is for a text-sized file.
    const unpacked = isPacked(head) ? await unpackPayload(head) : null;
    return { mime: sniffMime(unpacked || head) };
  }
  if (src.ranged) {
    // A dot address: never fetch a part to find out what the payload is.
    const ends = await rangedEnds().catch(() => null);
    if (ends) {
      if (looksLikeZipTail(ends.tail)) return { zip: true };
      const packed = isPacked(ends.head);
      const plain = packed ? await unpackPrefix(ends.head) : null;
      return { mime: sniffMime(plain || ends.head), packed };
    }
    // No worker (a `file://` page, or one refusing service workers): fall back to the parts.
  }
  const tail = await partPayload(src.urls.length - 1);
  if (looksLikeZipTail(tail)) return { zip: true };
  const head = await partPayload(0);
  // Part 1 alone is not the whole deflate stream of a PACKED payload, so this is the tolerant
  // prefix inflate, not unpackPayload — otherwise a 7.75 MB packed webm sniffed as "binary".
  const packed = isPacked(head);
  const unpacked = packed ? await unpackPrefix(head) : null;
  return { mime: sniffMime(unpacked || head), packed };
}

function parseCentral(block, at, entries, cdSize, cdOff, total) {
  const start = cdOff - at;
  if (start < 0) throw new Error('the central directory starts before the bytes that were read');
  const files = [];
  let k = start;
  const end = Math.min(start + cdSize, block.length);
  while (k + 46 <= end && u32(block, k) === 0x02014b50 && files.length < 5000) {
    const method = u16(block, k + 10);
    const dosTime = u16(block, k + 12);
    const dosDate = u16(block, k + 14);
    const crc = u32(block, k + 16);
    const csize = u32(block, k + 20);
    const size = u32(block, k + 24);
    const nlen = u16(block, k + 28);
    const elen = u16(block, k + 30);
    const clen = u16(block, k + 32);
    const localOff = u32(block, k + 42);
    const name = new TextDecoder().decode(block.subarray(k + 46, k + 46 + nlen));
    const when = (dosDate || dosTime)
      ? new Date(Date.UTC(1980 + ((dosDate >> 9) & 0x7f), ((dosDate >> 5) & 0x0f) - 1, dosDate & 0x1f,
                          (dosTime >> 11) & 0x1f, (dosTime >> 5) & 0x3f, (dosTime & 0x1f) * 2))
      : null;
    files.push({ path: name, size, csize, method, localOff, crc,
                 dir: /\/$/.test(name), modified: when });
    k += 46 + nlen + elen + clen;
  }
  if (files.length !== entries) {
    throw new Error(`the directory holds ${entries} entr${entries === 1 ? 'y' : 'ies'} but only ` +
                    `${files.length} could be read`);
  }
  return { files, total };
}

async function memberBytes(f) {
  const head = await sourceRange(f.localOff, f.localOff + 29);
  if (!(head[0] === 0x50 && head[1] === 0x4b && head[2] === 0x03 && head[3] === 0x04)) {
    throw new Error('the member local header is not where the directory says it is');
  }
  const nlen = u16(head, 26), elen = u16(head, 28);
  const dataStart = f.localOff + 30 + nlen + elen;
  if (!f.csize) return new Uint8Array(0);
  const comp = await sourceRange(dataStart, dataStart + f.csize - 1);
  if (f.method === 0) return comp;
  if (f.method === 8) return inflate(comp, 'deflate-raw');
  throw new Error(`member uses compression method ${f.method}, which this page cannot unpack`);
}

// Apache 2.4's autoindex, copied: the same table, the same icon column, the same date and size
// columns, and the `<address>` line at the bottom. The only change is the first data row: where
// Apache puts "Parent Directory", this puts "Download Zip".
const ICON_BY_EXT = {
  text: 'txt md html htm json js css csv xml sh py diff ini yml yaml svg'.split(' '),
  compressed: 'zip gz bz2 xz 7z rar tar tgz apk jar'.split(' '),
  image2: 'png jpg jpeg gif webp bmp ico'.split(' '),
  movie: 'mp4 webm mov mkv m4v'.split(' '),
  sound1: 'mp3 ogg wav flac m4a opus'.split(' '),
};
function iconFor(path, dir) {
  if (dir) return ['folder', '[DIR]'];
  const ext = ((path.match(/\.([A-Za-z0-9]+)$/) || [])[1] || '').toLowerCase();
  for (const [icon, list] of Object.entries(ICON_BY_EXT)) {
    if (list.includes(ext)) return [icon, icon === 'text' ? '[TXT]' : icon === 'image2' ? '[IMG]'
      : icon === 'movie' ? '[VID]' : icon === 'sound1' ? '[SND]' : '[   ]'];
  }
  return ['unknown', '[   ]'];
}
// Apache's size column: bytes plain, then 27K / 1.4M / 304K.
function apacheSize(n) {
  if (!Number.isFinite(n)) return '-';
  if (n < 1024) return String(n);
  const units = ['K', 'M', 'G', 'T'];
  let v = n, i = -1;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v >= 10 ? Math.round(v) : v.toFixed(1)}${units[i]}`;
}
// Apache's date column: 2026-10-18 22:00
function apacheDate(d) {
  if (!d) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ` +
         `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
}
function indexOf(files, total, name) {
  $('where').textContent = `Index of ${name}`;
  $('kind').textContent = '';
  $('meta').textContent = '';
  document.title = `Index of ${name}`;
  clearStage();

  const table = document.createElement('table');
  const rule = () => {
    const tr = document.createElement('tr');
    const th = document.createElement('th');
    th.colSpan = 5;
    th.appendChild(document.createElement('hr'));
    tr.appendChild(th);
    table.appendChild(tr);
  };
  const head = document.createElement('tr');
  const iconTh = document.createElement('th');
  iconTh.setAttribute('valign', 'top');
  const blank = document.createElement('img');
  blank.src = '/icons/blank.gif';
  blank.alt = '[ICO]';
  iconTh.appendChild(blank);
  head.appendChild(iconTh);
  for (const label of ['Name', 'Last modified', 'Size', 'Description']) {
    const th = document.createElement('th');
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = label;
    th.appendChild(a);
    head.appendChild(th);
  }
  table.appendChild(head);
  rule();

  const addRow = (icon, alt, text, onClick, date, size) => {
    const tr = document.createElement('tr');
    const ic = document.createElement('td');
    ic.setAttribute('valign', 'top');
    const img = document.createElement('img');
    img.src = `/icons/${icon}.gif`;
    img.alt = alt;
    ic.appendChild(img);
    tr.appendChild(ic);
    const nm = document.createElement('td');
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = text;
    if (onClick) a.addEventListener('click', (e) => { e.preventDefault(); onClick(a); });
    nm.appendChild(a);
    tr.appendChild(nm);
    const dt = document.createElement('td');
    dt.setAttribute('align', 'right');
    dt.textContent = date + '  ';
    tr.appendChild(dt);
    const sz = document.createElement('td');
    sz.setAttribute('align', 'right');
    sz.textContent = size;
    tr.appendChild(sz);
    const de = document.createElement('td');
    de.textContent = '\u00a0';
    tr.appendChild(de);
    table.appendChild(tr);
    return a;
  };

  const zipLink = addRow('back', '[PARENTDIR]', 'Download Zip', async (a) => {
    a.textContent = 'fetching…';
    try {
      const bytes = await wholeFile();
      saveBytes(bytes, name, 'application/zip');
      status(`saved ${name} — ${fmt(bytes.length)}`);
    } catch (err) { status(`could not fetch the archive: ${err.message}`, true); }
    a.textContent = 'Download Zip';
  }, '', '-');
  zipLink.id = 'download-zip';
  zipLink.title = `Download ${name} (${fmt(total)})`;

  for (const f of files) {
    const [icon, alt] = iconFor(f.path, f.dir);
    const label = f.path.replace(/\/$/, '') + (f.dir ? '/' : '');
    const a = addRow(icon, alt, label, f.dir ? null : async (el) => {
      el.textContent = label + ' …';
      try {
        const bytes = await memberBytes(f);
        const base = f.path.replace(/^.*\//, '');
        saveBytes(bytes, base, mimeFromName(base));
        status(`saved ${base} — ${fmt(bytes.length)}`);
      } catch (err) { status(`could not read ${f.path}: ${err.message}`, true); }
      el.textContent = label;
    }, apacheDate(f.modified), f.dir ? '-' : apacheSize(f.size));
    if (!f.dir) {
      a.className = 'member';
      a.title = `${f.path} (${fmt(f.size)}) — only the bytes this member needs`;
    }
  }
  rule();
  stage.appendChild(table);
  const addr = document.createElement('address');
  addr.textContent = 'jarivizero.github.io';
  stage.appendChild(addr);
  status(`${files.length} entr${files.length === 1 ? 'y' : 'ies'} read from the end of the file`);
}

// A member of an archive, rendered BY its own byte range. `/file/<base>/bug.gif` lands here.
async function renderZipMember(baseLabel, memberPath) {
  const want = String(memberPath || '').replace(/^\/+/, '');
  status(`Reading the directory of ${baseLabel}…`);
  let listing = null, whole = null;
  try {
    listing = await readZipCentral();
  } catch (e) {
    // A packed payload has no byte-for-byte offsets; the whole file is the only way in.
    whole = await wholeFile();
    listing = await zipFromMemory(whole);
  }
  const find = (test) => listing.files.find(test);
  const entry = find((f) => f.path === want)
    || find((f) => f.path.toLowerCase() === want.toLowerCase())
    || find((f) => f.path.endsWith('/' + want));
  if (!entry) throw new Error(`"${want}" is not in ${baseLabel}`);
  if (entry.dir) throw new Error(`"${want}" is a folder, not a file`);
  const bytes = whole ? await extractFrom(whole, entry) : await memberBytes(entry);
  const name = entry.path.replace(/^.*\//, '');
  await renderBytes(bytes, name, baseLabel);
}

// Member bytes out of an archive that is already in memory (the packed-payload path).
async function extractFrom(block, f) {
  const lo = f.localOff;
  if (!(block[lo] === 0x50 && block[lo + 1] === 0x4b && block[lo + 2] === 0x03 && block[lo + 3] === 0x04)) {
    throw new Error('the member local header is not where the directory says it is');
  }
  const nlen = u16(block, lo + 26), elen = u16(block, lo + 28);
  const start = lo + 30 + nlen + elen;
  const comp = block.subarray(start, start + f.csize);
  if (f.method === 0) return comp;
  if (f.method === 8) return inflate(comp, 'deflate-raw');
  throw new Error(`member uses compression method ${f.method}, which this page cannot unpack`);
}

// Bytes with a name → the thing they are. One place, so a zip member and a plain payload render
// the same way (an HTML member becomes the document, an image is an image, text is text).
async function renderBytes(bytes, name, fromLabel) {
  const mime = mimeFromName(name) || sniffMime(bytes);
  document.title = name;
  $('where').textContent = name;
  $('kind').textContent = mime;
  $('meta').textContent = fmt(bytes.length);
  document.body.className = '';
  clearStage();
  if (mime.startsWith('image/')) {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(new Blob([bytes], { type: mime }));
    img.alt = name;
    stage.appendChild(img);
  } else if (mime === 'text/html') {
    window.__fileHtml = name;
    document.open();
    document.write(new TextDecoder().decode(bytes));
    document.close();
    return;
  } else if (mime.startsWith('text/') || mime === 'application/json' || mime === 'application/xml') {
    document.body.className = 'plain';
    const pre = document.createElement('pre');
    pre.textContent = new TextDecoder().decode(bytes);
    stage.appendChild(pre);
  } else if (mime.startsWith('video/') || mime.startsWith('audio/')) {
    const el = document.createElement(mime.startsWith('video/') ? 'video' : 'audio');
    el.controls = true;
    el.src = URL.createObjectURL(new Blob([bytes], { type: mime }));
    if (mime.startsWith('video/')) document.body.className = 'media';
    stage.appendChild(el);
  } else {
    const p = document.createElement('p');
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = `Download ${name} (${fmt(bytes.length)})`;
    a.addEventListener('click', (e) => { e.preventDefault(); saveBytes(bytes, name, mime); });
    p.appendChild(a);
    stage.appendChild(p);
  }
  status(`${name} — ${fmt(bytes.length)}${fromLabel ? ` from ${fromLabel}` : ''}`);
}

// ─── a MASTER file ────────────────────────────────────────────────────────────────────────────
// `x-draft.py` writes a payload that is not a file but a LIST of files:
//   #bin2png-manifest v1
//   file\t<name>\t<bytes>\t<parts>\t<sha256>
//   part\t<n>\t<url>\t<id>
// bin2png.js has resolved these since 2026-10-17; this page showed one as "binary". Render what it
// names: the first entry, at the address the master was opened by.
function followManifest(bytes) {
  const text = new TextDecoder('utf-8', { fatal: false }).decode(bytes.subarray(0, 262144));
  if (!text.startsWith('#bin2png-manifest v1')) return null;
  const files = [];
  for (const line of text.split('\n')) {
    if (!line || line.startsWith('#')) continue;
    const f = line.split('\t');
    if (f[0] === 'file' && f.length >= 4) files.push({ name: f[1], parts: [] });
    // Column 3 is the pbs url (or its hash); column 4 is the NUMERIC media id upload returned, which
    // is NOT a pbs id — using it made `?format=png` 404 (his 2026-10-19: "not a valid image id").
    else if (f[0] === 'part' && f.length >= 3 && files.length) {
      files[files.length - 1].parts.push(f[2] || f[3]);
    }
  }
  const first = files.find((f) => f.parts.length);
  if (!first) return null;
  return {
    name: first.name || src.name,
    urls: first.parts.map((p) => (/^https?:/i.test(p) ? p : `https://pbs.twimg.com/media/${p}?format=png`)),
  };
}

// ─── the router ───────────────────────────────────────────────────────────────────────────────
let manifestDepth = 0;   // one hop only: a master that names a master is a bug, not a file

// A name that is NOT in the dictionary must end on the 404 art, not on a red status line — and a
// name with a media extension should put the player up FIRST, because that is what the address

function show404() {
  document.body.className = 'plain';
  stage.textContent = '';
  const a = document.createElement('a');
  a.href = '/bin2png';
  const img = document.createElement('img');
  img.src = '/404.png';
  img.alt = 'not found';
  img.style.cssText = 'display:block;margin:0 auto;max-width:100vw;max-height:100vh';
  a.appendChild(img);
  stage.appendChild(a);
  document.title = 'not found';
}

function optimisticMedia() {
  const el = document.createElement('video');
  el.controls = true;
  el.playsInline = true;
  el.style.cssText = 'display:block;width:100vw;height:100vh;object-fit:contain;background:#000';
  document.body.className = 'media';
  stage.textContent = '';
  stage.appendChild(el);
  return el;
}

async function run() {
  const address = decodeURIComponent(location.hash.replace(/^#/, '')).trim();

  // `file/.HU3ep_nXIAAa6AR+…` reads the FIRST part's start and the LAST part's end through the
  // worker's byte ranges — the head says mp4/text/png, the tail says zip — instead of downloading
  // each part to find out. The dot is not part of the name: the id list behind it is the address.
  let ranged = false;
  let raw = address;
  while (raw.startsWith('.') && raw.length > 1) { ranged = true; raw = raw.slice(1); }
  clearStage();
  $('where').textContent = raw || 'file';
  $('kind').textContent = '';
  $('meta').textContent = '';
  stage.textContent = '';
  stage.appendChild(statusEl);
  if (!raw) {
    stage.innerHTML = '<p>Open a file by name: file#yakusoku.mp4, file#notes.txt, ' +
      'file#something.zip.</p>';
    return;
  }
  // A media name goes up at once; resolving it decides whether it stays or becomes the 404 art.
  const mediaName = !/^https?:/i.test(raw) && !/^id:/i.test(raw) && /^(video|audio)\//.test(mimeFromName(raw));
  if (mediaName) optimisticMedia();
  // `/file/<base>/<member>` — the address may point INSIDE a zip (bug.gif in a zip of a game).
  // Try the whole token first (a dictionary name can contain a slash), then split at the first one.
  let token, member = null;
  try {
    token = await resolveToken(raw);
  } catch (e) {
    const cut = raw.indexOf('/');
    if (cut <= 0) {

      console.warn('address not resolved:', e.message);
      show404();
      return;
    }
    try {
      token = await resolveToken(raw.slice(0, cut));
      member = raw.slice(cut + 1);
    } catch (e2) { console.warn('address not resolved:', e2.message); show404(); return; }
  }
  document.body.className = '';
  if (mediaName) { stage.textContent = ''; stage.appendChild(statusEl); }   // the placeholder player is done
  // `direct` means "an ordinary http url", where the browser's own Range requests work. A pbs url
  // is NEVER direct: its bytes are pixels, so every byte has to come through the codec.
  src = { name: token.name || 'file', urls: token.urls, ranged,
          direct: /^https?:/i.test(raw) && token.urls.length === 1 && !/pbs\.twimg\.com\/media\//.test(raw) };
  // The part cache is keyed by PART NUMBER, so a hash change to a different file would read the
  // previous file's part 1 (measured here: `#hello.txt` then `#bundle.zip` listed the text's bytes
  // as the zip's first member). A new address starts with an empty cache.
  partCache.clear();
  // A dot address decides by its BYTES, never by a name: the whole point is that nothing about the
  // payload is known until the two ends have been read. (Without this, `#.id:<url>` inherited `.png`
  // from the url and rendered an image instead of playing the video inside it.)
  let mime = src.ranged ? '' : mimeFromName(src.name);
  let zipByName = !src.ranged && /\.(zip|apk|jar)$/i.test(src.name);
  document.title = src.name;
  $('where').textContent = src.name;
  $('kind').textContent = mime || 'file';
  status('');

  // An id carries no extension. Read the two ENDS before deciding — the last part says "zip" when
  // its EOCD ends exactly at the last byte, the first part says video/text/image. Never the whole

  if (!mime) {
    status('Reading the start and the end of the file to see what it is…');
    try {
      const probe = await sniffSource();
      if (probe.packed && /^(video|audio)\//.test(probe.mime || '')) {
        // PACKED cannot stream: the player would read DEFLATE bytes. This page unpacks the whole
        // file instead, and says why (his 2026-10-19 report: a packed webm showed "binary").
        status(`${probe.mime} — stored packed (deflated), so it is fetched and unpacked in full ` +
               'before it plays; a packed payload cannot be byte-ranged.');
      }
      if (probe.packed) src.packed = true;
      if (probe.zip) zipByName = true;
      else if (probe.mime) {
        mime = probe.mime;
        const ext = { 'video/mp4': 'mp4', 'video/x-matroska': 'mkv', 'video/webm': 'webm',
                      'audio/mpeg': 'mp3', 'audio/ogg': 'ogg', 'audio/flac': 'flac' }[mime] || '';
        // Only when the existing suffix is not already a media type: an id has none, `clip.dat`
        // has a useless one. The name is what a save will be called, so it should say what it is.
        if (ext && !mimeFromName(src.name)) src.name = `${src.name}.${ext}`;
      }
    } catch (e) {
      // A failed probe still leaves the whole-file path — but say WHY on the console, or a broken
      // probe is invisible (it only shows up as a slow page).
      console.warn('probe failed:', e && e.message);
      status('', false);
    }
    document.title = src.name;
    $('where').textContent = src.name;
    $('kind').textContent = mime || (zipByName ? 'zip' : 'file');
  }

  try {
    if (mime.startsWith('video/') || mime.startsWith('audio/')) {
      await renderMedia(mime);
      return;
    }
    if (mime === 'application/zip' || zipByName) {
      status('Reading the end of the file for its directory…');
      if (member) {
        // An id has no extension; the archive still saves as an archive.
        const label = /\.(zip|apk|jar)$/i.test(src.name) ? src.name : `${src.name}.zip`;
        await renderZipMember(label, member);
        return;
      }
      let listing;
      try {
        listing = await readZipCentral();
      } catch (e) {
        // A packed payload has no byte-for-byte offsets: fall back to the whole file.
        status(`${e.message} — fetching the whole archive instead…`);
        const bytes = await wholeFile();
        listing = await zipFromMemory(bytes);
      }
      // An id has no extension; the archive still saves as an archive.
      const label = /\.(zip|apk|jar)$/i.test(src.name) ? src.name : `${src.name}.zip`;
      indexOf(listing.files, listing.total, label);
      return;
    }
    if (mime.startsWith('image/')) {
      document.body.className = 'plain';
      status('Fetching…');
      const bytes = await wholeFile();
      const img = document.createElement('img');
      img.src = URL.createObjectURL(new Blob([bytes], { type: mime }));
      $('meta').textContent = fmt(bytes.length);
      stage.appendChild(img);
      status(`${fmt(bytes.length)} — ${src.urls.length} part(s)`);
      return;
    }
    // Text, and anything else that is small enough to read: the bytes, then the bytes as text.
    status('Fetching…');
    const bytes = await wholeFile();

    // `file/blindspots.webm` is the master, and it must render like the 4-part file it lists).
    const master = manifestDepth < 1 ? followManifest(bytes) : null;
    if (master) {
      manifestDepth++;
      src = { name: master.name, urls: master.urls, direct: false, ranged: src.ranged };
      partCache.clear();
      stage.textContent = '';
      stage.appendChild(statusEl);
      status(`master file — rendering ${master.name} (${master.urls.length} part(s))…`);
      return run();
    }
    $('meta').textContent = fmt(bytes.length);
    // An HTML payload IS a page: render it as the document, not as its source. Same rule as
    // bin2png's `(html)` mode — document.open()/write()/close() drops this page and lets the
    // decoded page's own <style>/<script> run, with relative urls resolved against this directory.
    if (mime === 'text/html') {
      window.__fileHtml = src.name;
      document.open();
      document.write(new TextDecoder().decode(bytes));
      document.close();
      return;
    }
    if (mime.startsWith('text/') || mime === 'application/json' || mime === 'application/xml'
        || mime === 'application/pdf') {
      if (mime === 'application/pdf') {
        const embed = document.createElement('embed');
        embed.src = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        embed.type = 'application/pdf';
        embed.style.cssText = 'width:100%;height:calc(100vh - 140px);border:0;border-radius:8px;';
        stage.appendChild(embed);
      } else {
        const pre = document.createElement('pre');
        pre.textContent = new TextDecoder().decode(bytes);   // textContent, never innerHTML
        stage.appendChild(pre);
      }
      status(`${fmt(bytes.length)} — ${src.urls.length} part(s)`);
      return;
    }
    // Unknown binary: say what it is and let a click save it.
    const bar = document.createElement('div');
    bar.className = 'toolbar';
    const btn = document.createElement('button');
    btn.className = 'primary';
    btn.textContent = `⬇ Download ${src.name} (${fmt(bytes.length)})`;
    btn.addEventListener('click', () => saveBytes(bytes, src.name, mimeFromName(src.name)));
    bar.appendChild(btn);
    stage.appendChild(bar);
    status(`A ${mime || 'binary'} file — this page cannot render it.`);
  } catch (e) {
    status(e.message, true);
  }
}

// The fallback for a zip that was deflated by the encoder: the archive is in memory anyway.
async function zipFromMemory(bytes) {
  let block = bytes, at = 0;
  if (isPacked(bytes)) block = await unpackPayload(bytes);
  const eocd = findEocd(block);
  if (eocd < 0) throw new Error('no zip end-of-directory record');
  const entries = u16(block, eocd + 10);
  const cdSize = u32(block, eocd + 12);
  const cdOff = u32(block, eocd + 16);
  return parseCentral(block, at, entries, cdSize, cdOff, block.length);
}

window.addEventListener('hashchange', run);
run();
</script>
</body>
</html>
