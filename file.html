// 2026-10-19: a media address is the player from the very first frame, and a `.txt` address is a TEXT
// page from the very first frame, which for an ordinary tab means the canvas colour the UA picks from
// `<meta name="color-scheme" content="light dark">` — the one node a `file:///` .txt tab has in its
// head. A media name got that treatment and a text name did not, so a text page flashed black first.
// `,<id>` says video outright, an extension says which kind, `?name.ext` can ride along with an id.

  const fromPath = (location.pathname.match(/\/file\/(.+)$/) || [])[1]
    || (/^\/[A-Za-z0-9_-]{10,}(?:\.[A-Za-z0-9]+)?\/?$/.test(location.pathname) ? location.pathname.slice(1) : '')
    || '';

  const address = decodeURIComponent(hash || fromPath).trim();
  let hint = location.search.replace(/^\?/, '');
  try { hint = decodeURIComponent(hint); } catch (e) { hint = ''; }

  let raw = address;
  for (;;) {
    if (raw.length > 1 && (raw.charAt(0) === '.' || raw.charAt(0) === ',')) { raw = raw.slice(1); continue; }
    break;
  }
  const forcedMedia = address.charAt(0) === ',';
  const name = hint && !hint.includes('=') ? hint : raw;

  const e = ext ? ext.toLowerCase() : '';
  const MEDIA = ['mp4','m4v','mov','webm','mkv','avi','mp3','m4a','aac','ogg','oga','opus','flac','wav'];
  // The list of kinds a text tab covers: anything a `file:///` tab prints rather than plays. Kept
  // beside the same list in 404.html, which needs it for the FIRST frame of a cold visit.
  const IMAGE = ['png','jpg','jpeg','gif','webp','bmp','avif','ico','svg'];

    const meta = document.createElement('meta');
    meta.name = 'color-scheme';
    meta.content = 'light dark';
    document.head.appendChild(meta);
  } else {
    // An id with no extension: nothing is known yet, so leave the canvas alone (the sniff decides).
    document.documentElement.className = '';
  }
} catch (e) { /* a broken address is handled by run() */ }

async function resolveToken(token) {

async function saveAsDownload(mime) {
  resetPage('');
  document.title = src.name || 'file';
  let url = null;
  if (src.direct) url = src.urls[0];
  else if (src.tt) url = await ttPlanUrl(mime);
  else url = await streamUrlFor(src.name, src.urls, mime);
  if (url) {
    const sep = url.includes('?') ? '&' : '?';
    // A plain link, NOT the `download` attribute: a download-attribute request answered by a worker
    // is canceled by the browser. A navigation it can answer is the whole point (see the worker).
    const a = document.createElement('a');
    a.href = url + sep + 'dl=1';
    a.rel = 'noopener';
    body.appendChild(a);
    a.click();
    a.remove();
    return;
  }
  // No worker at all (an insecure context, or a browser without one): read the file in the page and
  // hand over a blob, which is the same save without the streaming. It costs the whole file, and
  // there is no other way left.
  saveBytes(await wholeFile(), src.name, mime);
}

async function renderMedia(mime) {
  mime = mime || 'application/octet-stream';
  const head = await peekForRender();
  // A master file is followed before anything is offered to a player.
  if (manifestDepth < 1 && isManifestHead(head.plain)) {
    const master = followManifest(await wholeFile());
    if (master) {
      manifestDepth++;
      src = { ...src, name: master.name, urls: master.urls, packed: false };
      partCache.clear();
      return renderMedia(mimeFromName(master.name) || '');
    }
  }
  
  if (head.plain) {
    const text = new TextDecoder('utf-8', { fatal: false }).decode(head.plain.subarray(0, 64)).trimStart();
    if (text.startsWith('{') || text.startsWith('[')) {
      const index = parseTt2png(await wholeFile());
      if (index) return renderTt2png(index);
    }
  }
  if (SAVE_REQUEST) return saveAsDownload(mime);
  const isVideo = mime.startsWith('video/');
  // The element IS the page: created in <body>, never wrapped, never moved. Its tag is the one the
  // address promised, so a `.mp3` never ends up with a <video> on screen.
  const el = pendingVideo && (isVideo === (pendingVideo.tagName === 'VIDEO'))
    ? pendingVideo : bareMedia(isVideo ? 'video' : 'audio');
  pendingVideo = null;

  // Following a master lands here with NEW parts and no sniff of its own, so the head read above is
  // the one that says whether what it names is PACKED (a packed webm otherwise went black for 23 s).
  if (!src.direct && !src.packed && head.packed) src.packed = true;
  if (src.direct) {
    // An ordinary url is already streamable by the browser: point at it and let it do the work.
    setMediaSource(el, src.urls[0], mime);
  } else {
    // A PACKED payload (B2PZ) is a deflate stream: byte N of the file is not at byte N of the
    // payload, so a player reading ranges gets compressed bytes and dies. Fetch and unpack instead.
    const url = src.packed ? null : await streamUrlFor(src.name, src.urls, mime);
    if (url) setMediaSource(el, url, mime);
    else setMediaSource(el, URL.createObjectURL(new Blob([await wholeFile()], { type: mime })), mime);
  }
  
  if (src.guess) {
    el.addEventListener('error', () => { if (!el.readyState) show404(); }, { once: true });
  }
  return el;
}

// The player's source, set the way a `file:///` media document carries it: a <source> child, not a
// `src` attribute on the element (measured 2026-10-19 on Brave's own .webm tab).
function setMediaSource(el, url, mime) {
  let s = el.querySelector('source');
  if (!s) { s = document.createElement('source'); el.appendChild(s); }
  s.type = mime || '';
  s.src = url;
  el.load();
}

// ─── zip: the directory lives at the end, so only the tail is fetched ─────────────────────────
const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
const u64 = (b, o) => u32(b, o) + u32(b, o + 4) * 4294967296;

function findEocd(buf) {
  for (let i = buf.length - 22; i >= 0; i--) if (u32(buf, i) === 0x06054b50) return i;
  return -1;
}

// Parse the central directory from `block`, whose byte 0 is absolute offset `at`.
async function readZipCentral() {
  // A chunk list is read the same way an ordinary url is: by ranges, from a size the index already
  // states. Only a bin2png part list needs the last-part walk below.
  if (src.direct || src.tt) return readZipCentralDirect();
  const n = src.urls.length;
  let last = await partPayload(n - 1);
  // The EOCD is in the last 22 bytes plus a comment of at most 65535 — grow the tail backwards
  // until the record is inside it (a small last part happens when the file cut lands near the end).
  let block = last, at = (n - 1) * CAPACITY, from = n - 2;
  let eocd = findEocd(block);
  while (eocd < 0 && from >= 0 && block.length < 70000) {
    const prev = await partPayload(from--);
    block = concat([prev, block]);
    at -= prev.length;
    eocd = findEocd(block);
  }
  if (eocd < 0) {
    // Not a zip at these offsets. The address may still point at an INDEX that NAMES one — a tt2png
    // index carries the archive's own name (`Pictures.zip`), and a bin2png master is a list of
    // parts. Follow it once and read the real archive, instead of fetching the whole thing.
    if (await followIndex(await sourceRange(0, 4095).catch(() => null))) return readZipCentral();
    throw new Error('no zip end-of-directory record in the last part');
  }
  const total = at + block.length;
  let entries = u16(block, eocd + 10);
  let cdSize = u32(block, eocd + 12);
  let cdOff = u32(block, eocd + 16);
  if (entries === 0xffff || cdSize === 0xffffffff || cdOff === 0xffffffff) {
    // ZIP64: a locator just before the EOCD points at the real record.
    let loc = -1;
    for (let i = eocd - 20; i >= 0; i--) if (u32(block, i) === 0x07064b50) { loc = i; break; }
    if (loc >= 0) {
      const z64 = u64(block, loc + 8);
      const zoff = z64 - at;
      if (zoff >= 0 && zoff + 56 <= block.length && u32(block, zoff) === 0x06064b50) {
        entries = u64(block, zoff + 32);
        cdSize = u64(block, zoff + 40);
        cdOff = u64(block, zoff + 48);
      } else throw new Error('this zip is ZIP64 and its directory is further back than one part');
    } else throw new Error('this zip is ZIP64 with no locator in the tail');
  }
  // The directory may start before the tail that was read: fetch exactly the parts that hold it.
  if (cdOff < at) {
    const first = Math.floor(cdOff / CAPACITY);
    const pieces = [];
    for (let i = first; i < n; i++) pieces.push(await partPayload(i));
    block = concat(pieces);
    at = first * CAPACITY;
  }
  return parseCentral(block, at, entries, cdSize, cdOff, total);
}

// A zip behind a byte-range source (one ordinary url, or a tt2png chunk list): ask for the tail,
// then for the directory, with ranges.
const ZIP_TAIL = 65557;
async function readZipCentralDirect() {
  const total = await sourceSize();
  if (!total) throw new Error('this server does not report a size, so the zip tail cannot be located');
  const tailStart = Math.max(0, total - ZIP_TAIL - 22);
  let block = await sourceRange(tailStart, total - 1);
  let at = tailStart;
  let eocd = findEocd(block);
  if (eocd < 0) throw new Error('no zip end-of-directory record in the last 64 KB');
  let entries = u16(block, eocd + 10);
  let cdSize = u32(block, eocd + 12);
  let cdOff = u32(block, eocd + 16);
  if (entries === 0xffff || cdSize === 0xffffffff || cdOff === 0xffffffff) {
    let loc = -1;
    for (let i = eocd - 20; i >= 0; i--) if (u32(block, i) === 0x07064b50) { loc = i; break; }
    if (loc >= 0) {
      const z64 = u64(block, loc + 8);
      const dir = await sourceRange(z64, z64 + 55);
      if (u32(dir, 0) === 0x06064b50) {
        entries = u64(dir, 32); cdSize = u64(dir, 40); cdOff = u64(dir, 48);
      }
    }
  }
  if (cdOff < at) {
    block = await sourceRange(cdOff, Math.min(total - 1, cdOff + cdSize + 64));
    at = cdOff;
  }
  return parseCentral(block, at, entries, cdSize, cdOff, total);
}

// ─── when the address says nothing: read the two ENDS, never the whole file ───────────────────
// A name carries its type; an id does not. So for an unnamed payload the page reads the LAST part
// (a zip's directory is there) and the FIRST part (a container's magic bytes). Two parts at most,
// and neither is wasted: the tail is what the listing needs and the head is what the player
// starts with.
function sniffMime(head) {
  const b = head;
  const at = (i, ...sig) => sig.every((v, k) => b[i + k] === v);
  if (b.length > 12 && at(4, 0x66, 0x74, 0x79, 0x70)) return 'video/mp4';       // …ftyp
  // EBML covers BOTH .webm and .mkv, and the element will not play a blob labelled
  // video/x-matroska even when the bytes are a webm. The DocType in the header says which it is.
  if (at(0, 0x1a, 0x45, 0xdf, 0xa3)) {
    const head = new TextDecoder('latin1').decode(b.subarray(0, Math.min(64, b.length)));
    return /webm/i.test(head) ? 'video/webm' : 'video/x-matroska';
  }
  if (at(0, 0x89, 0x50, 0x4e, 0x47)) return 'image/png';
  if (at(0, 0xff, 0xd8, 0xff)) return 'image/jpeg';
  if (at(0, 0x47, 0x49, 0x46, 0x38)) return 'image/gif';
  if (at(0, 0x52, 0x49, 0x46, 0x46) && b.length > 11) return 'image/webp';
  // A Windows icon: 00 00 01 00, then the image count. An address with no name (an id) has only
  // these bytes to go on, and without them an .ico is "unknown binary".
  if (b.length > 5 && at(0, 0x00, 0x00, 0x01, 0x00)) return 'image/x-icon';
  if (at(0, 0x25, 0x50, 0x44, 0x46)) return 'application/pdf';
  if (at(0, 0x49, 0x44, 0x33)) return 'audio/mpeg';
  if (at(0, 0x4f, 0x67, 0x67, 0x53)) return 'audio/ogg';
  if (at(0, 0x66, 0x4c, 0x61, 0x43)) return 'audio/flac';
  // Text: no control bytes in the first 4 KB (tab/newline/cr are fine) and something printable.
  const sample = b.subarray(0, Math.min(4096, b.length));
  let ctrl = 0, printable = 0;
  for (const c of sample) {
    if (c === 9 || c === 10 || c === 13) continue;
    if (c < 32 || c > 126) { if (c < 128) ctrl++; } else printable++;
  }
  if (sample.length && ctrl / sample.length <= 0.02 && printable > 0) {
    const s = new TextDecoder().decode(sample).trimStart();
    if (/^<(!doctype|html|\?xml)/i.test(s)) return 'text/html';
    if (/^[{[]/.test(s)) return 'application/json';
    return 'text/plain';
  }
  return '';
}

// A zip is recognised by a STRUCTURAL test, not by a signature that happens to appear: the EOCD's
// comment length has to end exactly at the last byte.
function looksLikeZipTail(tail) {
  const at = findEocd(tail);
  if (at < 0) return false;
  const comment = u16(tail, at + 20);
  if (at + 22 + comment !== tail.length) return false;
  const entries = u16(tail, at + 10);
  const cdSize = u32(tail, at + 12);
  return entries > 0 && cdSize > 0;
}

// [start, end] of the PAYLOAD, answered by the service worker: it decodes only the PNG prefix that
// carries those bytes. This is the read a `.`-prefixed address is for.
async function streamRange(planUrl, start, end) {
  if (end < start) return new Uint8Array(0);
  const res = await fetch(planUrl, { headers: { Range: `bytes=${start}-${end}` } });
  if (res.status !== 206) return null;
  return new Uint8Array(await res.arrayBuffer());
}

// The head of part 1 and the tail of the last part — the only two reads a `.`-address makes before
// it knows what the payload is. The total comes from the worker's HEAD (it decodes the last part's
// length, which it has to do once anyway to answer a range at all).
async function rangedEnds() {
  if (!src.urls.length) return null;
  const planUrl = await streamUrlFor(src.name || 'file', src.urls, 'application/octet-stream');
  if (!planUrl) return null;
  const headRes = await fetch(planUrl, { method: 'HEAD' });
  const total = Number(headRes.headers.get('Content-Length')) || 0;
  if (!total) return null;
  const head = await streamRange(planUrl, 0, Math.min(total - 1, 65535));
  const tail = await streamRange(planUrl, Math.max(0, total - 65557), total - 1);
  if (!head || !tail) return null;
  return { head, tail, total };
}

// `head` rides along on every non-zip answer: the caller uses it to notice that the payload is a
// LIST of other payloads (a master, a tt2png index) without reading anything a second time.
async function sniffSource() {
  if (src.direct) {
    const total = await sourceSize();
    if (!total) return { mime: '' };
    const tail = await sourceRange(Math.max(0, total - 65557), total - 1);
    if (looksLikeZipTail(tail)) return { zip: true };
    const head = await sourceRange(0, Math.min(total - 1, 65535));
    // A packed payload (the encoder's DEFLATE wrapper) hides its type; unpack when the head is
    // enough for it, which it always is for a text-sized file.
    const unpacked = isPacked(head) ? await unpackPayload(head) : null;
    return { mime: sniffMime(unpacked || head), head };
  }
  if (src.ranged) {
    // A dot address: never fetch a part to find out what the payload is.
    const ends = await rangedEnds().catch(() => null);
    if (ends) {
      if (looksLikeZipTail(ends.tail)) return { zip: true };
      const packed = isPacked(ends.head);
      const plain = packed ? await unpackPrefix(ends.head) : null;
      return { mime: sniffMime(plain || ends.head), packed, head: ends.head };
    }
    // No worker (a `file://` page, or one refusing service workers): fall back to the parts.
  }
  try {
    const tail = await partPayload(src.urls.length - 1);
    if (looksLikeZipTail(tail)) return { zip: true };
    const head = await partPayload(0);
    // Part 1 alone is not the whole deflate stream of a PACKED payload, so this is the tolerant
    // prefix inflate, not unpackPayload — otherwise a 7.75 MB packed webm sniffed as "binary".
    const packed = isPacked(head);
    const unpacked = packed ? await unpackPrefix(head) : null;
    return { mime: sniffMime(unpacked || head), packed, head };
  } catch (e) {
    
    const head = await partPayloadLoose(0).catch(() => null);
    if (!head) throw e;
    return { head, mime: '', packed: isPacked(head), short: e.message };
  }
}

function parseCentral(block, at, entries, cdSize, cdOff, total) {
  const start = cdOff - at;
  if (start < 0) throw new Error('the central directory starts before the bytes that were read');
  const files = [];
  let k = start;
  const end = Math.min(start + cdSize, block.length);
  while (k + 46 <= end && u32(block, k) === 0x02014b50 && files.length < 5000) {
    const method = u16(block, k + 10);
    const dosTime = u16(block, k + 12);
    const dosDate = u16(block, k + 14);
    const crc = u32(block, k + 16);
    const csize = u32(block, k + 20);
    const size = u32(block, k + 24);
    const nlen = u16(block, k + 28);
    const elen = u16(block, k + 30);
    const clen = u16(block, k + 32);
    const localOff = u32(block, k + 42);
    const name = new TextDecoder().decode(block.subarray(k + 46, k + 46 + nlen));
    const when = (dosDate || dosTime)
      ? new Date(Date.UTC(1980 + ((dosDate >> 9) & 0x7f), ((dosDate >> 5) & 0x0f) - 1, dosDate & 0x1f,
                          (dosTime >> 11) & 0x1f, (dosTime >> 5) & 0x3f, (dosTime & 0x1f) * 2))
      : null;
    files.push({ path: name, size, csize, method, localOff, crc,
                 dir: /\/$/.test(name), modified: when });
    k += 46 + nlen + elen + clen;
  }
  if (files.length !== entries) {
    throw new Error(`the directory holds ${entries} entr${entries === 1 ? 'y' : 'ies'} but only ` +
                    `${files.length} could be read`);
  }
  return { files, total };
}

const MEMO_CACHE = 'b2p-memo-v1';
const MEMO_MAX_BYTES = 64 * 1024 * 1024;   // a member bigger than this is read, never stored
let memoBase = null;
async function memoRoot() {
  if (memoBase) return memoBase;
  const id = src.tt
    ? (src.tt.sha256 || (src.tt.chunks || []).map((c) => c.url).join('\n'))
    : src.urls.join('\n');
  memoBase = await sha256(new TextEncoder().encode(String(id)));
  return memoBase;
}
const memoUrl = async (what) => siteUrl('__b2p/memo/' + (await memoRoot()) + '/' +

// `/__b2p/stats` answers it for pbs. Reset by every page load, so a test reads the current visit.
const memoStats = { hit: 0, miss: 0, put: 0 };

// `null` = nothing remembered, or the Cache API is not available here (private mode, no quota):
// every read then costs exactly what it used to, and the page still works.
async function memoGet(what) {
  try {
    const hit = await (await caches.open(MEMO_CACHE)).match(await memoUrl(what));
    if (!hit) { memoStats.miss++; return null; }
    memoStats.hit++;
    if (hit.headers.get('X-Memo') === 'json') return { json: await hit.json() };
    return { bytes: new Uint8Array(await hit.arrayBuffer()) };
  } catch (e) { memoStats.miss++; return null; }
}
async function memoPut(what, value) {
  try {
    const bytes = value instanceof Uint8Array;
    if (bytes && value.length > MEMO_MAX_BYTES) return;
    const cache = await caches.open(MEMO_CACHE);
    await cache.put(new Request(await memoUrl(what)), new Response(bytes ? value : JSON.stringify(value), {
      headers: { 'Content-Type': 'application/octet-stream', 'X-Memo': bytes ? 'bytes' : 'json' },
    }));
    memoStats.put++;
  } catch (e) { /* over quota, private mode: the visit still works */ }
}
// One read per page load, however many callers ask for the same bytes.
function once(get) {
  let job = null;
  return () => (job || (job = Promise.resolve().then(get)));

async function memberBytes(f) {
  const what = `member|${f.path}|${f.localOff}|${f.csize}|${f.method}`;
  const memo = await memoGet(what);
  if (memo && memo.bytes) return memo.bytes;
  const bytes = await memberBytesFresh(f);
  if (bytes.length <= MEMO_MAX_BYTES) await memoPut(what, bytes);
  return bytes;
}
async function memberBytesFresh(f) {
  const head = await sourceRange(f.localOff, f.localOff + 29);
  if (!(head[0] === 0x50 && head[1] === 0x4b && head[2] === 0x03 && head[3] === 0x04)) {
    throw new Error('the member local header is not where the directory says it is');
  }
  const nlen = u16(head, 26), elen = u16(head, 28);
  const dataStart = f.localOff + 30 + nlen + elen;
  if (!f.csize) return new Uint8Array(0);
  const comp = await sourceRange(dataStart, dataStart + f.csize - 1);
  if (f.method === 0) return comp;
  if (f.method === 8) return inflate(comp, 'deflate-raw');
  throw new Error(`member uses compression method ${f.method}, which this page cannot unpack`);
}

// Apache 2.4's autoindex, copied: the same table, the same icon column, the same date and size
// columns, and the `<address>` line at the bottom. The only change is the first data row: where
// Apache puts "Parent Directory", this puts "Download Zip".
const ICON_BY_EXT = {
  text: 'txt md html htm json js css csv xml sh py diff ini yml yaml svg'.split(' '),
  compressed: 'zip gz bz2 xz 7z rar tar tgz apk jar'.split(' '),
  image2: 'png jpg jpeg gif webp bmp ico'.split(' '),
  movie: 'mp4 webm mov mkv m4v'.split(' '),
  sound1: 'mp3 ogg wav flac m4a opus'.split(' '),
};
function iconFor(path, dir) {
  if (dir) return ['folder', '[DIR]'];
  const ext = ((path.match(/\.([A-Za-z0-9]+)$/) || [])[1] || '').toLowerCase();
  for (const [icon, list] of Object.entries(ICON_BY_EXT)) {
    if (list.includes(ext)) return [icon, icon === 'text' ? '[TXT]' : icon === 'image2' ? '[IMG]'
      : icon === 'movie' ? '[VID]' : icon === 'sound1' ? '[SND]' : '[   ]'];
  }
  return ['unknown', '[   ]'];
}
// Apache's size column: bytes plain, then 27K / 1.4M / 304K.
function apacheSize(n) {
  if (!Number.isFinite(n)) return '-';
  if (n < 1024) return String(n);
  const units = ['K', 'M', 'G', 'T'];
  let v = n, i = -1;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v >= 10 ? Math.round(v) : v.toFixed(1)}${units[i]}`;
}
// Apache's date column: 2026-10-18 22:00
function apacheDate(d) {
  if (!d) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ` +
         `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;

function indexView(label, total, opts) {
  opts = opts || {};
  const baseLabel = opts.base || label;
  resetPage('');
  const state = { label, total: total || 0 };
  document.title = `Index of ${label}`;

  // The head a `file:///` listing has: the color-scheme meta (white in light mode, dark in dark)
  // and that page's own stylesheet.
  if (!document.head.querySelector('meta[name="color-scheme"]')) {
    const meta = document.createElement('meta');
    meta.name = 'color-scheme';
    meta.content = 'light dark';
    document.head.appendChild(meta);
  }
  if (!document.getElementById('b2p-index-style')) {
    const style = document.createElement('style');
    style.id = 'b2p-index-style';
    style.textContent = INDEX_CSS;

  }

  const h1 = document.createElement('h1');
  h1.id = 'header';
  h1.textContent = `Index of ${label}`;
  body.appendChild(h1);

  if (opts.parentHref) {
    const box = document.createElement('div');
    box.id = 'parentDirLinkBox';
    const a = document.createElement('a');
    a.id = 'parentDirLink';
    a.className = 'icon up';
    a.href = opts.parentHref;
    
    const span = document.createElement('span');
    span.id = 'parentDirText';
    span.textContent = '[parent directory]';
    a.appendChild(span);
    box.appendChild(a);
    body.appendChild(box);

  // at the archive root, which has no parent).
  let zipLink = null, dirLink = null;

    const box = document.createElement('div');
    box.id = 'downloadBox';
    if (!opts.parentHref || opts.downloadZip) {
      zipLink = document.createElement('a');
      zipLink.id = 'download-zip';
      zipLink.className = 'icon file';
      zipLink.href = '#';
      zipLink.textContent = 'Download Zip';

      zipLink.addEventListener('click', async (e) => {
        e.preventDefault();
        const shows = progressOn(zipLink, 'fetching…', 'Download Zip');
        try {
          const got = opts.downloadZip ? await opts.downloadZip(shows) : await saveWholeArchive(shows);
          status(got.stream

      });

      if (opts.downloadDir) box.appendChild(document.createTextNode(' · '));
    }
    if (opts.downloadDir) {
      dirLink = document.createElement('a');
      dirLink.id = 'download-dir';
      dirLink.className = 'icon dir';
      dirLink.href = '#';
      dirLink.textContent = 'Download current dir as zip';
      dirLink.addEventListener('click', async (e) => {
        e.preventDefault();
        const shows = progressOn(dirLink, 'zipping…', 'Download current dir as zip');
        try {
          const got = await opts.downloadDir(shows);
          status(got.stream
            ? `downloading ${got.name} — ${got.total || got.count} file(s) in the browser`
            : `saved ${got.name} — ${fmt(got.size)}`);
        } catch (err) { status(`could not zip this folder: ${err.message}`, true); }
        if (!dirLink.dataset.busy) dirLink.textContent = 'Download current dir as zip';
      });
      box.appendChild(dirLink);
    }
    body.appendChild(box);
  }

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  headRow.className = 'header';
  headRow.id = 'theader';
  const TH = (id, text, cls) => {
    const th = document.createElement('th');
    th.id = id;
    if (cls) th.className = cls;
    th.tabIndex = 0;
    th.setAttribute('role', 'button');
    th.textContent = text;
    headRow.appendChild(th);
    return th;
  };
  const byName = TH('nameColumnHeader', 'Name');
  const bySize = TH('sizeColumnHeader', 'Size', 'detailsColumn');
  const byDate = TH('dateColumnHeader', 'Date Modified', 'detailsColumn');
  thead.appendChild(headRow);
  const tbody = document.createElement('tbody');
  tbody.id = 'tbody';
  table.append(thead, tbody);
  body.appendChild(table);

  const sortTable = (column) => {
    const oldOrder = parseInt(headRow.cells[column].dataset.order || '1', 10);
    const nextOrder = 0 - oldOrder;
    headRow.cells[column].dataset.order = String(nextOrder);
    const rows = [...tbody.rows];
    rows.sort((r1, r2) => {
      const a = r1.cells[column].dataset.value;
      const b = r2.cells[column].dataset.value;
      if (column) {
        const x = Number(a), y = Number(b);
        return x > y ? nextOrder : x < y ? oldOrder : 0;
      }
      return a > b ? nextOrder : a < b ? oldOrder : 0;
    });
    for (const r of rows) tbody.appendChild(r);
  };
  for (const [th, column] of [[byName, 0], [bySize, 1], [byDate, 2]]) {
    th.onclick = () => sortTable(column);
    th.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') { sortTable(column); e.preventDefault(); }
    };
  }

  const addRow = (cls, text, onClick, date, size, href) => {
    const tr = document.createElement('tr');
    const nameTd = document.createElement('td');
    nameTd.dataset.value = text;
    const a = document.createElement('a');
    a.className = `icon ${cls}`;
    a.style.backgroundImage = `url("${iconUrl(cls === 'dir' ? 'folder' : iconForFile(text))}")`;
    a.textContent = text;
    a.href = href || '#';
    if (href && cls !== 'dir') {
      // A FILE opens its own tab — the worker answers that url with the file ITSELF, so the tab is
      // the browser's own viewer. A FOLDER stays in this tab and the page turns into its listing.
      a.target = '_blank';

    const sizeTd = document.createElement('td');
    sizeTd.className = 'detailsColumn';
    sizeTd.dataset.value = String(Number.isFinite(size) ? size : 0);

  return {
    // The name can be learned later (an id has none): the heading follows it, nothing is rebuilt.
    setLabel(next) {
      state.label = next;
      h1.textContent = `Index of ${next}`;
      document.title = `Index of ${next}`;

      }, f.modified, f.dir ? 0 : f.size, href);
      a.className += f.dir ? ' folder' : ' member';
      if (listsHere && !f.dir) a.classList.add('archive-row');
      if (!f.dir) a.title = `${f.path} (${fmt(f.size)}) — opened by its own byte range`;

function indexOf(files, total, label) {
  const view = indexView(label, total);
  for (const f of files) view.addMember(f);
  return view;

function findEntry(files, want) {
  const w = String(want || '').replace(/\/+$/, '');
  if (!w) return null;
  const hit = files.find((f) => f.path === w)
    || files.find((f) => f.path.toLowerCase() === w.toLowerCase())
    || files.find((f) => f.path.endsWith('/' + w))
    || files.find((f) => f.dir && f.path.replace(/\/$/, '') === w);
  if (hit) return hit;
  // A folder that only exists as a PREFIX (a zip with no directory entries of its own).
  const inside = files.find((f) => f.path.startsWith(w + '/'));
  return inside ? { path: w + '/', size: 0, dir: true, modified: null } : null;

function ttArchiveIndex(...keys) {
  const map = (src.tt && src.tt.archives) || null;
  if (!map) return null;
  const want = keys.map((k) => String(k || '').replace(/^\/+/, '')).filter(Boolean);
  for (const k of want) if (map[k]) return map[k];
  for (const k of want) {
    const hit = Object.keys(map).find((key) => key.endsWith('/' + k))
      || (!k.includes('/') && Object.keys(map).find((key) => key.split('/').pop() === k));
    if (hit) return map[hit];
  }
  return null;
}

// that copy is free; otherwise it is the archive's central directory (one tail range).

    return src.tt.files.map(listedMember);

  return (await centralListing()).files;

// byte offsets, so nothing below can be a range).

      // next visit needs to avoid fetching it again.

// A member as the INDEX recorded it (`tiktokupload.py`'s listing, which travels in the index).
// The 7z signature (`37 7A BC AF 27 1C`): a payload can be a `.7z` whatever its name says.
function isSevenBytes(bytes) {
  return !!bytes && bytes.length > 6 && bytes[0] === 0x37 && bytes[1] === 0x7a && bytes[2] === 0xbc
    && bytes[3] === 0xaf && bytes[4] === 0x27 && bytes[5] === 0x1c;
}

function listedMember(f) {
  const path = String(f.path || '');
  const when = f.modified ? new Date(f.modified) : null;
  const row = { path, size: Number(f.size) || 0, dir: !!f.dir || /\/$/.test(path),
           modified: when && !isNaN(when) ? when : null,
           // The manifest's own previews, carried through the listing (a data URL, a text head, a
           // duration). Absent on an upload made before the uploader wrote them.
           thumb: typeof f.thumb === 'string' ? f.thumb : '',
           head: typeof f.head === 'string' ? f.head : '',
           dur: typeof f.dur === 'string' ? f.dur : '' };
  // WHERE THE BYTES ARE. `tiktokupload.py` writes `off` / `csize` / `method` for every member, and
  // this function dropped all three — so a save that range-reads the member had no offsets, could
  // not stream, and fell back to buffering the whole file. `indexedEntry` and `keepEntry` already
  // keep the same three for the same reason.
  if (Number.isFinite(Number(f.off))) row.localOff = Number(f.off);
  if (f.csize !== undefined) row.csize = Number(f.csize);
  if (f.method !== undefined) row.method = Number(f.method);

  return siteUrl('file/' + base + '/' + rel);

  const base = String(label || 'archive.zip').split('/').map(encodeURIComponent).join('/');
  return siteUrl('file/' + base);

// archive's page points at.
function archiveHref(label) {
  const base = String(label || 'archive.zip').split('/').map(encodeURIComponent).join('/');
  return siteUrl('file/' + base);

// a `file:///` directory tab shows (and what makes a folder worth its own page).
// `thumb` / `head` / `dur` ride along when the manifest previewed the member (the uploader writes
// them): the media grid draws from those, and a member with neither keeps its type icon.

  const rows = new Map();
  for (const f of files) {
    if (!f.path.startsWith(prefix)) continue;
    const rest = f.path.slice(prefix.length);
    if (!rest) continue;
    const cut = rest.indexOf('/');
    const name = cut < 0 ? rest : rest.slice(0, cut + 1);

      rows.set(name, { path: prefix + name, size: cut < 0 ? Number(f.size) || 0 : 0,

async function resolveArchivePath(rawPath) {

  // only exist in memory — then nothing outside this page can stream them.

  // offset for a STORED archive inside it (so its members are ranges of the same file and the worker
  // can stream them), null when nothing outside the page can read them.
  let spanBase = 0;

    const archive = entry && !entry.dir && /\.(zip|apk|jar|7z|tar)$/i.test(name);

      // read out of it is remembered under, so visit two is free.
      const at = walked.concat([name]).join('/');
      const reader = read;
      const getBytes = once(() => reader(entry.path));
      // Only the address's OWN archive has offsets `sourceRange` can use; deeper levels are already
      // in memory, so they keep the whole-bytes path.
      const stored = reader === rootRead ? await storedSpan(await withOffsets(entry)) : null;
      spanBase = stored ? stored.base : null;
      // `at` is the address's own path (`burrow-client-main.zip` when a folder was left out of it);
      // `entry.path` is where the archive really sits (`Burrow/burrow-client-main.zip`), which is
      // what the index calls it.

      if (ownFile && !/\.7z$/i.test(entry.path)) slice = sourceRange;
      else if (!ownFile) slice = stored && !/\.7z$/i.test(entry.path) ? stored.range : null;
      continue;

    const dir = !!entry && entry.dir;

  // since the last archive, then whatever is left. Losing those folders was the regression this
  // caught — `/file/x.zip/docs/` came back as the ARCHIVE ROOT, so the folder page listed its parent.

  // the folders stepped into since — those are already the prefix of `entry.path`).
  const base = walked.slice(0, walked.length - dirSince.length).join('/');

    if (!files) files = (await zipFromMemory(await getBytes())).files;
    await memoPut(tag + '|list', files.map(keepEntry));
  }
  return {
    files,
    read: async (p) => {
      const what = tag + '|file|' + p;
      const memo = await memoGet(what);
      if (memo && memo.bytes) return memo.bytes;
      const e = findEntry(files, p);
      if (!e) throw new Error(`"${p}" is not in ${path}`);
      // Every entry carries `localOff`/`csize`/`method` (keepEntry/reviveEntry), so a stored member
      // is read by range whichever listing produced it — index, memo or whole bytes.
      let out = null;
      if (stored) { try { out = await zipReadRanged(stored.range, e); } catch (err) { out = null; } }
      if (!out) out = await extractFrom(await getBytes(), e);
      await memoPut(what, out);
      return out;
    },
  };
}

async function saveWholeArchive(onProgress) {
  const name = src.name || 'archive.zip';
  if (canStreamArchive()) {
    const plan = planForWorker(name, 'application/zip');
    const job = await startStreamedSave({ kind: 'file', name, plan }, onProgress);
    if (job) return { name, size: plan.total, stream: true };
  }
  const bytes = await wholeFile(onProgress);
  saveBytes(bytes, name, 'application/zip');
  return { name, size: bytes.length };
}

// Member bytes out of an archive that is already in memory (the packed-payload path).
async function extractFrom(block, f) {
  const lo = f.localOff;
  if (!(block[lo] === 0x50 && block[lo + 1] === 0x4b && block[lo + 2] === 0x03 && block[lo + 3] === 0x04)) {
    throw new Error('the member local header is not where the directory says it is');
  }
  const nlen = u16(block, lo + 26), elen = u16(block, lo + 28);
  const start = lo + 30 + nlen + elen;
  const comp = block.subarray(start, start + f.csize);
  if (f.method === 0) return comp;
  if (f.method === 8) return inflate(comp, 'deflate-raw');
  throw new Error(`member uses compression method ${f.method}, which this page cannot unpack`);
}

function parseTt2png(bytes) {
  let text = '';
  try { text = new TextDecoder('utf-8', { fatal: false }).decode(bytes); } catch (e) { return null; }
  if (!/^\s*\{/.test(text)) return null;
  let j = null;
  try { j = JSON.parse(text); } catch (e) { return null; }
  if (!j || j.tool !== 'tt2png' || !Array.isArray(j.chunks) || !j.chunks.length) return null;
  return j;
}
// The payload a chunk carries: everything after the PNG's own IEND. The chunk list is WALKED, not
// searched — a payload may contain the letters "IEND" (the rule bin2png.html's decoder already has).
function chunkPayload(bytes) {
  if (!(bytes.length > 8 && bytes[0] === 0x89 && bytes[1] === 0x50)) return null;
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let off = 8;
  while (off + 8 <= bytes.length) {
    const len = dv.getUint32(off);
    const type = String.fromCharCode(bytes[off + 4], bytes[off + 5], bytes[off + 6], bytes[off + 7]);
    const end = off + 8 + len + 4;
    if (type === 'IEND') return bytes.subarray(Math.min(end, bytes.length));
    if (end > bytes.length) break;
    off = end;
  }
  return null;
}

const ttWhole = new Map();
async function ttChunk(i) {
  if (ttWhole.has(i)) return ttWhole.get(i);
  const c = src.tt.chunks[i] || {};
  if (!c.url) throw new Error(`chunk ${i + 1} of ${src.tt.chunks.length} has no url`);
  const res = await fetch(c.url, { mode: 'cors', credentials: 'omit' });
  if (!res.ok) {
    const err = new Error(`chunk ${i + 1}: HTTP ${res.status}`);
    err.httpStatus = res.status;
    throw err;
  }
  const payload = chunkPayload(new Uint8Array(await res.arrayBuffer()));
  if (!payload) throw new Error(`chunk ${i + 1} is not a tt2png PNG`);
  if (Number(c.size) && payload.length !== Number(c.size)) {
    throw new Error(`chunk ${i + 1} holds ${payload.length} B, the index says ${c.size} B`);
  }
  ttWhole.set(i, payload);
  return payload;
}
// ONE plan for this archive, in the worker's cache: it maps a file range to a chunk and fetches only
// the PNG prefix that carries those bytes. Without a worker there is no prefix decode, so the chunk
// itself is fetched (correct, just more bytes).
let ttPlan = null;
const ttPlanMimes = new Map();     // which type each cached tt plan was built for
async function ttPlanUrl(mime) {
  
  if (ttPlan !== null && (ttPlanMimes.get(ttPlan) || '') === (mime || '')) return ttPlan || null;
  ttPlan = '';
  const reg = await ensureStreamWorker();
  if (!reg) return null;
  const id = 'z' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const plan = { id, name: src.name || 'archive.zip', mime: mime || 'application/zip',
                 cap: Number(src.tt.chunk_size) || Number((src.tt.chunks[0] || {}).size) || CAPACITY,
                 parts: src.urls, total: Number(src.tt.bytes) || 0, tt: true };
  try {
    const cache = await caches.open(STREAM_PLAN_CACHE);
    await cache.put(new URL('__b2p/plan/' + id, streamScriptUrl()).href, new Response(JSON.stringify(plan), {
      headers: { 'Content-Type': 'application/json' },
    }));
  } catch (e) { return null; }
  ttPlan = new URL('__b2p/stream/?id=' + id, streamScriptUrl()).href;
  ttPlanMimes.set(ttPlan, mime || '');
  return ttPlan;
}

async function shareArchivePlan(label) {
  if (src.direct || src.packed) return;
  if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
  try {
    const plan = {
      id: null, name: label, mime: 'application/zip',
      cap: src.tt ? (Number(src.tt.chunk_size) || CAPACITY) : CAPACITY,
      parts: src.urls,
      total: await sourceSize(),
      tt: !!src.tt,
    };
    const key = new URL(
      '__b2p/plan/archive-' + (await sha256(new TextEncoder().encode(label))),
      streamScriptUrl()).href;
    const cache = await caches.open(STREAM_PLAN_CACHE);
    await cache.put(key, new Response(JSON.stringify(plan), {
      headers: { 'Content-Type': 'application/json' },
    }));
  } catch (e) { /* the renderer's own member route still works */ }
}

const TT_HEAD = 262144;      // 256 KB: the measured floor for a faststart MP4 (128 KB fails)
const TT_GRACE = 5;          // extend the blob when this few seconds of media remain
const TT_AHEAD = 3;          // chunks fetched ahead of the one needed

async function renderTt2pngProgressive(index, mime) {
  const n = index.chunks.length;
  const el = bareMedia(mime.startsWith('audio/') ? 'audio' : 'video');
  const parts = new Array(n);
  let p0 = null;             // chunk 1's payload, as much of it as has arrived
  let have = 0;              // chunks fully in hand, contiguous from 0
  let version = 0;           // bumped whenever p0 or `have` grows
  let shownVersion = 0;      // the version the player is holding
  let shownUrl = '';
  let started = false;       // the element has decoded something at least once

  const range = async (i, from, to) => {
    const c = index.chunks[i] || {};
    if (!c.url) throw new Error(`chunk ${i + 1} of ${n} has no url`);
    const headers = {};
    if (from || to !== undefined) headers.Range = `bytes=${from}-${to === undefined ? '' : to}`;
    const res = await fetch(c.url, { mode: 'cors', credentials: 'omit', headers });
    if (!res.ok) {
      const e = new Error(`chunk ${i + 1} of ${n}: HTTP ${res.status}`);
      e.httpStatus = res.status;
      throw e;
    }
    return new Uint8Array(await res.arrayBuffer());
  };
  const checkHash = async (bytes, payload, i) => {
    const c = index.chunks[i] || {};
    // Two writers, two conventions: tiktokupload.py hashes the WHOLE PNG it uploaded, a hand-built
    // index hashes the payload. Either digest proves the chunk is the one the index names.
    if (c.sha256 && (await sha256(bytes)) !== c.sha256 && (await sha256(payload)) !== c.sha256) {
      throw new Error(`chunk ${i + 1} of ${n} does not hash to the index`);
    }
  };
  const bytesNow = () => {
    if (have <= 1) return p0;
    return concat([p0, ...parts.slice(1, have)]);
  };
  const play = () => el.play().catch(() => { el.muted = true; el.play().catch(() => {  }); });
  // Swap in whatever is in hand. The position is carried across, or the picture would restart at 0
  // every time the prefix grows.
  const show = () => {
    if (!p0 || version === shownVersion) return;
    const at = el.currentTime || 0;
    const old = shownUrl;
    shownUrl = URL.createObjectURL(new Blob([bytesNow()], { type: mime }));
    if (at > 0.05) {
      el.addEventListener('loadedmetadata', () => { try { el.currentTime = at; } catch (e) { /* shorter */ } }, { once: true });
    }
    setMediaSource(el, shownUrl, mime);
    shownVersion = version;
    play();
    if (old) setTimeout(() => URL.revokeObjectURL(old), 60000);
  };
  const alive = (ms) => Promise.race([
    new Promise((ok) => {
      el.addEventListener('loadeddata', () => ok(true), { once: true });
      el.addEventListener('error', () => ok(false), { once: true });
    }),
    new Promise((ok) => setTimeout(() => ok(false), ms)),
  ]);
  const nearlyDry = () => (el.buffered.length
    ? el.buffered.end(el.buffered.length - 1) - (el.currentTime || 0) < TT_GRACE
    : false);
  // A truncated prefix does not politely stop at its last sample: Chrome raises MEDIA_ERR_DECODE
  // (measured 2026-10-23 — the 256 KB head plays ~50 ms and then errors) and the buffer empties,
  // which `nearlyDry()` would read as "nothing to do" and leave the player dead until the whole
  // file is in. So an error, or an empty buffer with more bytes in hand, is itself a reason to
  // extend the blob.
  const needsData = () => Boolean(el.error) || !el.buffered.length || nearlyDry();
  const ticker = setInterval(() => {
    if (version !== shownVersion && (shownVersion === 0 || needsData())) show();
  }, 750);

  try {
    // 1. the head — 256 KB, which is the moov plus the first frames of a faststart file
    const head = await range(0, 0, TT_HEAD - 1);
    // The rest of that part is asked for NOW, not after the head has proved it plays: waiting for
    // `loadeddata` first leaves the connection idle. One open-ended range, not a guessed span
    // split — the part is not always 5 MB (a fixture part of 3 MB, a 10 or 50 MB part are all real),
    // and a computed split would run past the end of a shorter one.
    const restP = head.length === TT_HEAD ? range(0, head.length) : Promise.resolve(null);
    p0 = chunkPayload(head);
    if (!p0) throw new Error('chunk 1 does not start with a PNG');
    version++;
    show();
    const headAlive = alive(4000);

    // 2. the rest of chunk 1 (never the first 256 KB twice), then what the head proved
    const rest = await restP;
    if (await headAlive) started = true;
    const whole = rest ? concat([head, rest]) : head;
    const payload0 = chunkPayload(whole);
    if (!payload0) throw new Error('chunk 1 is not a tt2png PNG');
    await checkHash(whole, payload0, 0);
    p0 = parts[0] = payload0;
    have = 1;
    version++;
    if (!started) { show(); if (await alive(2500)) started = true; }

    // 3. chunk 2..n, three ahead. A file whose moov is deep inside only starts once the prefix has
    //    reached it, so while nothing has decoded the blob is re-shown at 1, 2, 4, 8… chunks — one
    //    rebuild per doubling instead of one per chunk.
    const fetches = new Array(n);
    const pull = (i) => { if (i < n && !fetches[i]) { fetches[i] = range(i); fetches[i].catch(() => {}); } };
    let probeAt = 2;
    for (let i = 1; i < n; i++) {
      for (let k = i; k < Math.min(i + TT_AHEAD, n); k++) pull(k);
      const bytes = await fetches[i];
      const payload = chunkPayload(bytes);
      if (!payload) throw new Error(`chunk ${i + 1} of ${n} is not a tt2png PNG`);
      await checkHash(bytes, payload, i);
      parts[i] = payload;
      have = i + 1;
      version++;
      if (!started && have >= probeAt) {
        show();
        probeAt = Math.max(have + 1, have * 2);
        if (await alive(1500)) started = true;
      } else if (started && needsData()) {
        show();
      }
    }
    show();                                  // the whole file, so seeking and the end are real
  } catch (e) {
    clearInterval(ticker);
    document.title = `${index.name || 'file'} — ${e.message}`;
    throw e;
  }
  const stop = setInterval(() => { if (shownVersion === version) clearInterval(stop); else if (needsData()) show(); }, 750);
  return el;
}

async function renderTt2pngStream(index, mime) {
  if (!('serviceWorker' in navigator) || !navigator.serviceWorker) return null;
  const swUrl = new URL('../b2p-stream.js', location.href).href;
  let reg;
  try { reg = await navigator.serviceWorker.register(swUrl, { scope: new URL('./', swUrl).href }); }
  catch (e) { return null; }                                   // file://, a private window, an http origin
  await Promise.race([navigator.serviceWorker.ready, new Promise((ok) => setTimeout(ok, 2500))]);
  if (!navigator.serviceWorker.controller) {
    await Promise.race([
      new Promise((ok) => navigator.serviceWorker.addEventListener('controllerchange', ok, { once: true })),
      new Promise((ok) => setTimeout(ok, 1500)),
    ]);
  }
  if (!navigator.serviceWorker.controller) return null;        // the first visit, before claim()

  const id = 'tt-' + (index.sha256 || '').slice(0, 16) + '-' + index.chunks.length;
  const plan = {
    id,
    name: index.name || 'file.mp4',
    mime,
    cap: Number(index.chunk_size) || 5000000,
    parts: index.chunks.map((c) => c.url),
    total: Number(index.bytes) || 0,
    tt: true,
  };
  const planHref = new URL('__b2p/plan/' + encodeURIComponent(id), swUrl).href;
  await (await caches.open('b2p-plan-v1')).put(planHref, new Response(JSON.stringify(plan), {
    headers: { 'Content-Type': 'application/json' },
  }));
  const streamUrl = new URL('__b2p/stream/?id=' + encodeURIComponent(id), swUrl).href;
  return { el: bareMedia(mime.startsWith('audio/') ? 'audio' : 'video'), streamUrl };
}

// The whole file at once — the non-media types, and the fallback when MediaSource cannot take it.
async function renderTt2png(index) {
  // A file this page has no view for and cannot list: the index is its whole description, so the
  // metadata page is built here and not one chunk is read (measured: 10.23 MiB before this guard).
  if (!isRenderableName(index.name)) return renderFileInfo(index);
  
  if (SAVE_REQUEST) {
    src = { ...src, name: mimeFromName(src.name) ? src.name : (index.name || src.name),
            urls: index.chunks.map((c) => c.url), direct: false, guess: false, packed: false, tt: index };
    partCache.clear();
    ttWhole.clear();
    ttPlan = null;
    return saveAsDownload(mimeFromName(src.name) || 'application/octet-stream');
  }
  const mime = mimeFromName(index.name || '');
  if (!/^(video|audio)\//.test(mime)) return renderTt2pngFull(index);
  // The worker first: one source, one load(), no reloads. Anything that stops it being usable
  // (no worker, no control yet, a plan the worker refuses) falls back to the growing-blob player.
  try {
    const stream = await renderTt2pngStream(index, mime);
    if (stream) {
      setMediaSource(stream.el, stream.streamUrl, mime);
      const err = await Promise.race([
        new Promise((ok) => stream.el.addEventListener('error', () => ok(true), { once: true })),
        new Promise((ok) => setTimeout(() => ok(false), 6000)),
      ]);
      if (!err) { document.title = index.name || 'file'; return stream.el; }
      status('the stream worker could not serve this file — playing it from the parts instead.');
    }
  } catch (e) { /* the blob player below is the fallback, never a dead end */ }
  return renderTt2pngProgressive(index, mime);
}

async function renderTt2pngFull(index) {
  const pieces = [];
  for (let i = 0; i < index.chunks.length; i++) {
    const c = index.chunks[i] || {};
    if (!c.url) throw new Error(`chunk ${i + 1} of ${index.chunks.length} has no url`);
    const res = await fetch(c.url, { mode: 'cors', credentials: 'omit' });
    if (!res.ok) throw new Error(`chunk ${i + 1} of ${index.chunks.length}: HTTP ${res.status}`);
    const payload = chunkPayload(new Uint8Array(await res.arrayBuffer()));
    if (!payload) throw new Error(`chunk ${i + 1} of ${index.chunks.length} is not a tt2png PNG`);
    pieces.push(payload);
  }
  const bytes = concat(pieces);
  if (Number(index.bytes) && bytes.length !== Number(index.bytes)) {
    throw new Error(`the chunks hold ${bytes.length} B, the index says ${index.bytes} B`);
  }
  if (index.sha256 && (await sha256(bytes)) !== index.sha256) {
    throw new Error('the reassembled file does not hash to the index\u2019s sha256');
  }
  return renderBytes(bytes, index.name || 'file', '');
}

// Bytes with a name → the thing they are. One place, so a zip member and a plain payload render the
// same way (an HTML member becomes the document, an image is an image, text is text) — and each of
// them is BARE: no header, no type line, no meta line, exactly like opening the member from disk.
async function renderBytes(bytes, name, fromLabel) {
  const mime = mimeFromName(name) || sniffMime(bytes);
  if (mime === 'text/html') {
    window.__fileHtml = name;
    document.open();
    document.write(new TextDecoder().decode(bytes));
    document.close();
    return;
  }
  if (mime.startsWith('video/') || mime.startsWith('audio/')) {
    const el = bareMedia(mime.startsWith('audio/') ? 'audio' : 'video');
    setMediaSource(el, URL.createObjectURL(new Blob([bytes], { type: mime })), mime);
    return;
  }
  if (mime.startsWith('image/')) return bareImage(bytes, mime, name);
  if (mime.startsWith('text/') || mime === 'application/json' || mime === 'application/xml') {
    const text = new TextDecoder().decode(bytes);
    
    if (isMarkdownName(name)) { renderMarkdown(text, name); return; }
    bareText(text);
    return;
  }
  if (mime === 'application/pdf') {
    resetPage('');
    document.title = name;
    const embed = document.createElement('embed');
    embed.src = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    embed.type = 'application/pdf';
    embed.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0';
    document.documentElement.style.height = '100%';
    body.setAttribute('style', 'margin:0;height:100%;background:#000');
    body.appendChild(embed);
    return;
  }
  
  return binaryView(bytes, name, fromLabel);
}

// ─── a MASTER file ────────────────────────────────────────────────────────────────────────────
// `x-draft.py` writes a payload that is not a file but a LIST of files:
//   #bin2png-manifest v1
//   file\t<name>\t<bytes>\t<parts>\t<sha256>
//   part\t<n>\t<url>\t<id>
// bin2png.js has resolved these since 2026-10-17; this page showed one as "binary". Render what it
// names: the first entry, at the address the master was opened by.
function followManifest(bytes) {
  const text = new TextDecoder('utf-8', { fatal: false }).decode(bytes.subarray(0, 262144));
  if (!text.startsWith('#bin2png-manifest v1')) return null;
  const files = [];
  for (const line of text.split('\n')) {
    if (!line || line.startsWith('#')) continue;
    const f = line.split('\t');
    if (f[0] === 'file' && f.length >= 4) files.push({ name: f[1], parts: [] });
    
    else if (f[0] === 'part' && f.length >= 3 && files.length) {
      files[files.length - 1].parts.push(f[2] || f[3]);
    }
  }
  const first = files.find((f) => f.parts.length);
  if (!first) return null;
  return {
    name: first.name || src.name,
    urls: first.parts.map((p) => (/^https?:/i.test(p) ? p : `https://pbs.twimg.com/media/${p}?format=png`)),
  };
}

let indexHops = 0;
// The last tt2png index this address described, whether or not it was taken over. A file the page
// can neither draw nor list has no route of its own, and the index is the whole description of it.
let indexSeen = null;
async function followIndex(head) {
  if (!head || src.tt || indexHops >= 2) return false;
  const plain = isPacked(head) ? (await unpackPrefix(head).catch(() => null)) || head : head;
  // 1. a MASTER: the file's parts, tab separated.
  if (isManifestHead(plain)) {
    const master = followManifest(await wholeFile());
    if (!master) return false;
    indexHops++;
    src = { ...src, name: master.name, urls: master.urls, direct: false, guess: false, packed: false };
    partCache.clear();
    return true;
  }
  // 2. a tt2png INDEX. Only an ARCHIVE is taken over here: a media index keeps its own streaming
  //    player (renderMedia), which already reads ranges.
  const text = new TextDecoder('utf-8', { fatal: false }).decode(plain.subarray(0, 64)).trimStart();
  if (text.charAt(0) !== '{') return false;
  const index = parseTt2png(await wholeFile());
  if (index) indexSeen = index;
  // `.tar` too: the uploader lists a tar's members in the index (`_list_tar`), so an uploaded tar
  // can be listed from the index with no chunk read at all — the same deal a zip gets.
  // `.7z` is here for its NAME AND SIZE, not for a listing (the uploader cannot list one, and JS7z
  // is a decoder): without it an id whose index names a `.7z` had no name, no size, and no way to
  // answer "how big is this" except reading the payload — measured live 2026-10-27 on the
  // 8,800,760 B fixture, which sat on a part pull for 90 s to find out what it was. The caller's
  // own `nowSeven` branch was already waiting for exactly this.
  if (!index || !/\.(zip|apk|jar|tar|7z)$/i.test(String(index.name || ''))) return false;
  indexHops++;
  
  src = { ...src, name: mimeFromName(src.name) ? src.name : (index.name || src.name),
          urls: index.chunks.map((c) => c.url), direct: false, guess: false, packed: false, tt: index };
  partCache.clear();
  ttWhole.clear();
  ttPlan = null;
  return true;
}

// ─── the router ───────────────────────────────────────────────────────────────────────────────
let manifestDepth = 0;    // one hop only: a master that names a master is a bug, not a file
let pendingVideo = null;  // the optimistic player: the SAME element gets the real stream
let dictFreshOnce = false;  // one forced dictionary re-read per page, never a loop

const NOTFOUND_CSS = `
  html, body { margin:0; min-height:100%; background:#fff; color:#1b1b1f;
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; }
  p { margin:6px 0; }
  a { color:#0645ad; text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }
  #home { font-size:15px; }
`;
function show404() {
  pendingVideo = null;
  resetPage('notfound');
  // A media address left `html.media-address` (black) and a head with nothing in it. Rebuild both,
  // so every route ends on the identical page.
  document.documentElement.className = '';
  document.documentElement.removeAttribute('style');
  for (const n of [...document.head.childNodes]) n.remove();
  const meta = document.createElement('meta');
  meta.name = 'viewport';
  meta.content = 'width=device-width, initial-scale=1';
  const style = document.createElement('style');
  style.textContent = NOTFOUND_CSS;
  document.head.append(meta, style);
  document.title = '404 — not found';
  const img = document.createElement('img');
  img.src = siteUrl('404.png');
  img.alt = '404 — whatever you are looking for, it is not here';
  img.style.cssText = 'width:min(100%,420px);height:auto;display:block;margin:0 auto 8px';
  const home = document.createElement('p');
  home.id = 'home';
  const a = document.createElement('a');
  a.href = siteUrl('bin2png');
  a.textContent = 'click me to go home';
  home.appendChild(a);
  body.append(img, home);
}

// A player that IS the page: one element in <body>, the black window behind it, and the head and
// body a `file:///` media tab has. Both routes call this, so the element never moves — moving a
// <video> comes back as a fresh black frame (measured here).
function bareMedia(tag) {
  resetPage();
  // The black belongs to the WINDOW, not to a rule in a stylesheet: bareHead is about to remove
  // that stylesheet, and a transparent <html> is a frame that is not black (measured).
  document.documentElement.style.height = '100%';
  document.documentElement.style.background = '#000';
  body.setAttribute('style', 'margin:0;height:100%;background:#000;display:flex;' +
    'align-items:center;justify-content:center;overflow:hidden');
  bareHead('media');
  const el = document.createElement(tag);
  el.controls = true;
  el.autoplay = true;
  el.playsInline = true;
  el.setAttribute('name', 'media');
  el.setAttribute('style', 'display:block;max-width:100vw;max-height:100vh;background:#000');

const MD_EXT = /\.(md|markdown|mdown|mkd|mdwn)$/i;
const isMarkdownName = (name) => MD_EXT.test(String(name || ''));

function mdEscape(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// GitHub's anchor: lower case, spaces to dashes, and everything that is not a letter, digit, dash or
// underscore dropped.
function mdSlug(s) {
  return String(s).toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').trim()
    .replace(/\s+/g, '-');
}

// A url in a README is relative to the README — which is the address this page was opened by.
function mdUrl(url) {
  const u = String(url || '').trim();
  if (!u || /^(?:[a-z][a-z0-9+.-]*:|\/|#)/i.test(u)) return u;
  try { return new URL(u, location.href).href; } catch (e) { return u; }
}

function mdInline(src) {
  let s = mdEscape(src);
  // Code spans first: what is inside one is literal, so its markers are parked out of reach.
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, body) => {
    codes.push('<code>' + body.replace(/^ | $/g, '') + '</code>');
    return '\u0001' + (codes.length - 1) + '\u0001';
  });
  // Images before links: `![x](y)` contains `[x](y)`.
  s = s.replace(/!\[([^\]]*)\]\(\s*([^)\s]+)\s*\)/g,
    (m, alt, url) => `<img src="${mdUrl(url)}" alt="${alt}">`);
  s = s.replace(/\[([^\]]*)\]\(\s*([^)\s]+)\s*\)/g,
    (m, text, url) => `<a href="${mdUrl(url)}" rel="nofollow noopener">${text}</a>`);
  s = s.replace(/&lt;((?:https?|mailto):[^\s&]+)&gt;/g, (m, url) => `<a href="${url}">${url}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^_\w])_([^_\s][^_]*)_/g, '$1<em>$2</em>');
  s = s.replace(/ {2,}\n/g, '<br>\n');
  return s.replace(/\u0001(\d+)\u0001/g, (m, i) => codes[i]);
}

// Does this line OPEN a block of its own? A paragraph stops in front of one.
function mdOpens(lines, i) {
  const l = lines[i] || '';
  if (/^ {0,3}(`{3,}|~{3,})/.test(l)) return true;
  if (/^ {0,3}#{1,6}[ \t]+/.test(l)) return true;
  if (/^ {0,3}>/.test(l)) return true;
  if (/^ {0,3}([-*_])[ \t]*(?:\1[ \t]*){2,}$/.test(l)) return true;
  if (/^ {0,3}([-*+]|\d{1,9}[.)])[ \t]+/.test(l)) return true;
  if (/^ {4}\S/.test(l)) return true;
  const next = lines[i + 1] || '';
  if (/^ {0,3}\|?[ \t]*:?-{1,}:?[^|]*\|/.test(next)) return true;      // a table header row
  return false;
}

function mdList(lines, start) {
  const marker = /^( {0,3})([-*+]|(\d{1,9})[.)])[ \t]+/;
  const first = lines[start].match(marker);
  // The list's OWN indent is the level: a marker deeper than this belongs to the item above it, which
  // is what makes a nested list nested instead of a second list beside the first.
  const base = first[1].length;
  const ordered = /\d/.test(first[2]);
  const startAt = ordered ? Number(first[3]) : 1;
  const atLevel = (l) => {
    const m = l.match(marker);
    return !!m && m[1].length === base;
  };
  const items = [];
  let i = start;
  while (i < lines.length && atLevel(lines[i])) {
    const m = lines[i].match(marker);
    let rest = lines[i].slice(m[0].length);
    let task = null;
    const t = rest.match(/^\[([ xX])\][ \t]+/);
    if (t) { task = t[1].toLowerCase() === 'x'; rest = rest.slice(t[0].length); }
    const body = [rest];
    i++;
    // Its own continuation lines: a deeper marker, an indented paragraph — and it ends at the next
    // marker of its OWN level, or at a block that could not belong to an item.
    while (i < lines.length && lines[i].trim()) {
      const ind = (lines[i].match(/^ */) || [''])[0].length;
      const mm = lines[i].match(marker);
      if (mm && mm[1].length === base) break;
      if (!mm && ind <= base && mdOpens(lines, i)) break;
      body.push(lines[i].slice(Math.min(ind, base + 4)));
      i++;
    }
    items.push({ body: body.join('\n'), task });
  }
  const tag = ordered ? 'ol' : 'ul';
  const html = items.map((it) => {
    const nested = it.body.split('\n').slice(1).some((l) => marker.test(l));
    const loose = /\n[ \t]*\n/.test(it.body) || nested;
    const cls = it.task === null ? '' : ' class="task-list-item"';
    const box = it.task === null ? ''
      : '<input type="checkbox" disabled' + (it.task ? ' checked' : '') + '> ';
    return `<li${cls}>${box}${loose ? mdBlocks(it.body) : mdInline(it.body)}</li>`;
  }).join('\n');
  const attr = ordered && startAt !== 1 ? ` start="${startAt}"` : '';
  return { html: `<${tag}${attr}>\n${html}\n</${tag}>`, next: i };
}

function mdBlocks(text) {
  const lines = String(text).replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n');
  const out = [];
  const blank = (l) => !l.trim();
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (blank(line)) { i++; continue; }
    let m = line.match(/^ {0,3}(`{3,}|~{3,})[ \t]*([\w+#.-]*)[ \t]*$/);
    if (m) {
      const ticks = m[1].length;
      const close = new RegExp('^ {0,3}' + m[1][0] + '{' + ticks + ',}[ \\t]*$');
      const lang = m[2] || '';
      const buf = [];
      i++;
      while (i < lines.length && !close.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;                                                    // past the closing fence
      out.push('<pre' + (lang ? ` data-lang="${mdEscape(lang)}"` : '') + '><code>'
        + mdEscape(buf.join('\n')) + '</code></pre>');
      continue;
    }
    m = line.match(/^ {0,3}(#{1,6})[ \t]+(.*?)[ \t]*#*[ \t]*$/);
    if (m) {
      const n = m[1].length;
      out.push(`<h${n} id="${mdSlug(m[2])}">${mdInline(m[2])}</h${n}>`);
      i++;
      continue;
    }
    // A heading underlined with === or ---
    if (i + 1 < lines.length && /^ {0,3}(=+|-+)[ \t]*$/.test(lines[i + 1])) {
      const n = lines[i + 1].trim()[0] === '=' ? 1 : 2;
      out.push(`<h${n} id="${mdSlug(line)}">${mdInline(line.trim())}</h${n}>`);
      i += 2;
      continue;
    }
    if (/^ {0,3}([-*_])[ \t]*(?:\1[ \t]*){2,}$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (/^ {0,3}>/.test(line)) {
      const buf = [];
      while (i < lines.length && (/^ {0,3}>/.test(lines[i])
             || (buf.length && lines[i].trim() && !mdOpens(lines, i)))) {
        buf.push(lines[i].replace(/^ {0,3}> ?/, ''));
        i++;
      }
      out.push('<blockquote>\n' + mdBlocks(buf.join('\n')) + '\n</blockquote>');
      continue;
    }
    // A GFM table: a header row, a delimiter row, then rows.
    if (line.includes('|') && i + 1 < lines.length
        && /^ {0,3}\|?[ \t]*:?-+:?[ \t]*(\|[ \t]*:?-+:?[ \t]*)+\|?[ \t]*$/.test(lines[i + 1])) {
      const cells = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
      const head = cells(line);
      const align = cells(lines[i + 1]).map((c) =>
        (/^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : /^:-/.test(c) ? 'left' : ''));
      const at = (k) => (align[k] ? ` style="text-align:${align[k]}"` : '');
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {
        rows.push('<tr>' + cells(lines[i]).map((c, k) => `<td${at(k)}>${mdInline(c)}</td>`).join('') + '</tr>');
        i++;
      }
      out.push('<table><thead><tr>' + head.map((c, k) => `<th${at(k)}>${mdInline(c)}</th>`).join('')
        + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>');
      continue;
    }
    if (/^ {0,3}([-*+]|\d{1,9}[.)])[ \t]+/.test(line)) {
      const list = mdList(lines, i);
      if (list.next > i) { out.push(list.html); i = list.next; continue; }
      // The cursor did not move: a marker line that is not a list is a paragraph, and this
      // page never spins on a line no rule claimed.
      out.push('<p>' + mdInline(line.trim()) + '</p>');
      i++;
      continue;
    }
    if (/^ {4}\S/.test(line)) {
      const buf = [];
      while (i < lines.length && (/^ {4}/.test(lines[i]) || blank(lines[i]))) {
        buf.push(lines[i].replace(/^ {4}/, ''));
        i++;
      }
      while (buf.length && blank(buf[buf.length - 1])) buf.pop();
      out.push('<pre><code>' + mdEscape(buf.join('\n')) + '</code></pre>');
      continue;
    }
    const buf = [];
    while (i < lines.length && !blank(lines[i]) && !mdOpens(lines, i)) { buf.push(lines[i]); i++; }
    if (!buf.length) { i++; continue; }                        // never spin on a line no rule claimed
    out.push('<p>' + mdInline(buf.join('\n').trim()) + '</p>');
  }
  return out.join('\n');
}

function renderMarkdown(text, name) {
  resetPage('md-page');
  // The head first, the TITLE after it: clearing the head removes the <title> that `document.title`
  // writes, so setting it before the clear left the tab nameless.
  for (const n of [...document.head.childNodes]) n.remove();
  document.title = name || 'README.md';
  const meta = document.createElement('meta');
  meta.name = 'viewport'; meta.content = 'width=device-width';
  document.head.appendChild(meta);
  const style = document.createElement('style');
  style.textContent = MD_CSS;
  document.head.appendChild(style);
  const art = document.createElement('article');
  art.className = 'markdown-body';
  // `innerHTML` is fed HTML this file BUILT, and every byte of the file went through mdEscape first:
  // a README cannot put a tag on this page that mdBlocks did not write.
  art.innerHTML = mdBlocks(String(text));
  body.appendChild(art);
  return art;
}

function bareText(text) {
  resetPage();
  bareHead('text');
  const pre = document.createElement('pre');
  pre.setAttribute('style', 'word-wrap: break-word; white-space: pre-wrap;');
  pre.textContent = text;
  body.appendChild(pre);
  return pre;
}

// An image tab in Brave is a dark canvas with the picture in the middle and its name and dimensions
// in the title (measured: `<html style="height:100%">`, body #0e0e0e, `img { display:block; margin:auto }`).
function bareImage(bytes, mime, name) {
  resetPage();
  bareHead('image');
  document.documentElement.style.height = '100%';
  body.setAttribute('style', 'margin:0;height:100%;background-color:#0e0e0e;' +
    'display:flex;align-items:center;justify-content:center');
  const img = document.createElement('img');
  img.setAttribute('style', 'display:block;margin:auto;max-width:100%;max-height:100%;' +
    '-webkit-user-select:none;cursor:zoom-in');
  img.alt = name;
  img.src = URL.createObjectURL(new Blob([bytes], { type: mime }));
  body.appendChild(img);
  img.addEventListener('load', () => {
    document.title = `${name} (${img.naturalWidth}×${img.naturalHeight})`;
  }, { once: true });
  return img;
}

function barePdf(bytes) {
  resetPage();
  document.documentElement.style.height = '100%';
  body.setAttribute('style', 'margin:0;height:100%;background:#000');
  const embed = document.createElement('embed');
  embed.src = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  embed.type = 'application/pdf';
  embed.style.cssText = 'display:block;width:100%;height:100%;border:0';

// A type this page cannot render — an .apk, an .rbxm, anything with no view. It is still just a file
// on a file host, so it gets the host's page: name, size, type, date, ETag, SHA-256, and the one
// button that hands the bytes over (his ask 2026-10-29: "non renderable files like apks or python or

const SAVE_PAGE = 1 << 20;                 // 1 MB per ranged read, one at a time — real backpressure

async function memberLocalStart(f, slice) {
  const head = await slice(f.localOff, f.localOff + 29);
  if (!(head[0] === 0x50 && head[1] === 0x4b && head[2] === 3 && head[3] === 4)) {
    throw new Error('the member local header is not where the directory says it is');
  }
  return f.localOff + 30 + u16(head, 26) + u16(head, 28);
}

// The buffered path's bytes, read page by page so the page has a number to show. Same order the
// ranged save uses — one 1 MB range at a time, a deflated member inflated on the way in — only the
// output is collected in memory instead of being written to a file handle.
async function memberBytesWithProgress(f, slice, onProgress) {
  const start = await memberLocalStart(f, slice);
  const end = start + Number(f.csize);
  const total = end - start;
  const chunks = [];
  let got = 0;
  if (Number(f.method) !== 8) {
    for (let a = start; a < end; a += SAVE_PAGE) {
      const bytes = await slice(a, Math.min(a + SAVE_PAGE, end) - 1);
      chunks.push(bytes);
      got += bytes.length;
      if (onProgress) onProgress(got, total);
    }
  } else {
    const ds = new DecompressionStream('deflate-raw');
    const feeder = (async () => {
      const w = ds.writable.getWriter();
      try {
        for (let a = start; a < end; a += SAVE_PAGE) {
          const bytes = await slice(a, Math.min(a + SAVE_PAGE, end) - 1);
          got += bytes.length;
          if (onProgress) onProgress(got, total);
          await w.write(bytes);
        }
        await w.close();
      } catch (e) {
        try { await w.abort(e); } catch (e2) { /* the readable side already ended */ }
        throw e;
      }
    })();
    const reader = ds.readable.getReader();
    await Promise.all([feeder, (async () => {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) return;
        chunks.push(value);
      }
    })()]);
  }
  return new Uint8Array(await new Blob(chunks).arrayBuffer());
}

    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = `saving ${fmt(size)}…`;

    const bar = box.querySelector('progress');
    const line = box.querySelector('#b2p-save-line');
    const clock = () => (typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now());
    const t0 = clock();

        tail = ` · ${fmt(rate)}/s · ETA ${Math.max(1, Math.ceil((total - done) / rate))}s`;
