// A zip is recognised by a STRUCTURAL test, not by a signature that happens to appear: the EOCD's

// [start, end] of the PAYLOAD, answered by the service worker: it decodes only the PNG prefix that
// carries those bytes. This is the read a `.`-prefixed address is for.
async function streamRange(planUrl, start, end) {
  if (end < start) return new Uint8Array(0);
  const res = await fetch(planUrl, { headers: { Range: `bytes=${start}-${end}` } });

// it knows what the payload is. The total comes from the worker's HEAD (it decodes the last part's
// length, which it has to do once anyway to answer a range at all).

  if (!planUrl) return null;
  const headRes = await fetch(planUrl, { method: 'HEAD' });
  const total = Number(headRes.headers.get('Content-Length')) || 0;
  if (!total) return null;
  const head = await streamRange(planUrl, 0, Math.min(total - 1, 65535));
  const tail = await streamRange(planUrl, Math.max(0, total - 65557), total - 1);

// `head` rides along on every non-zip answer: the caller uses it to notice that the payload is a
// LIST of other payloads (a master, a tt2png index) without reading anything a second time.
async function sniffSource() {

    const tail = await sourceRange(Math.max(0, total - 65557), total - 1);
    if (looksLikeZipTail(tail)) return { zip: true };

    // enough for it, which it always is for a text-sized file.
    const unpacked = isPacked(head) ? await unpackPayload(head) : null;

    const ends = await rangedEnds().catch(() => null);

      return { mime: sniffMime(plain || ends.head), packed, head: ends.head };

  }

    const tail = await partPayload(src.urls.length - 1);
    if (looksLikeZipTail(tail)) return { zip: true };
    const head = await partPayload(0);
    // Part 1 alone is not the whole deflate stream of a PACKED payload, so this is the tolerant
    // prefix inflate, not unpackPayload — otherwise a 7.75 MB packed webm sniffed as "binary".
    const packed = isPacked(head);

    return { mime: sniffMime(unpacked || head), packed, head };
  } catch (e) {

    // a tiny part 1, so the capacity check threw "part 1 holds 0 B" and the whole address fell
    // through to "application/zip — this page cannot render it": no listing, no `Index of /`.
    // A part that is short is a DESCRIPTION, not corruption — read it without the assertion and let
    // `followIndex` decide what it describes.
    const head = await partPayloadLoose(0).catch(() => null);
    if (!head) throw e;
    return { head, mime: '', packed: isPacked(head), short: e.message };

  ttPlan = new URL('__b2p/stream/?id=' + id, streamScriptUrl()).href;

      id: null, name: label, mime: 'application/zip',

// ─── a tt2png video STARTS ON A BYTE RANGE, not on a whole part ───────────────────────────────
// Until 2026-10-23 this page fetched every chunk, joined them, checked the sha256 and only then had
// bytes a player could take: a 46 MB file had no <video> element until 23.5 s and its first frame
// arrived at 24.0 s, after the last chunk landed at 22.5 s (measured).
//
// MediaSource is NOT the fix: the file is split at arbitrary byte offsets, and MSE only takes media
// in its own segmenting (moof / cluster boundaries). Appending a plain MP4 fragment into a
// SourceBuffer left the element at currentTime 0 with duration NaN (measured 2026-10-23).
//
// What the container itself allows: a faststart MP4 keeps its moov at the FRONT, so a Blob holding
// only the head of the file already decodes. His 2026-10-23 follow-up — "it waits for the full 5mb
// part, that's not needed" — was right, and the CDN answers ranges (`206 bytes 0-262143/5000070`,
// measured), so the head is a RANGE REQUEST, not a chunk:
//   moov ends 65,446 B into that 46 MB file, so 64 KB and 128 KB prefixes fail (MEDIA_ERR_DECODE)
//   and 256 KB plays — measured, that is where TT_HEAD comes from.
// Playback starts on those 256 KB; the rest of chunk 1 is fetched as `Range: bytes=262144-` (so no
// byte is fetched twice), then chunks 2..n three ahead. The blob is rebuilt only when the player is
// about to run dry, and every completed chunk is checked against its own sha256 as it lands — the
// same guarantee as before, since a file whose every chunk matches is the file that was uploaded.
const TT_HEAD = 262144;      // 256 KB: the measured floor for a faststart MP4 (128 KB fails)
const TT_GRACE = 5;          // extend the blob when this few seconds of media remain
const TT_AHEAD = 3;          // chunks fetched ahead of the one needed

async function renderTt2pngProgressive(index, mime) {
  const n = index.chunks.length;
  const el = bareMedia(mime.startsWith('audio/') ? 'audio' : 'video');
  const parts = new Array(n);
  let p0 = null;             // chunk 1's payload, as much of it as has arrived
  let have = 0;              // chunks fully in hand, contiguous from 0
  let version = 0;           // bumped whenever p0 or `have` grows
  let shownVersion = 0;      // the version the player is holding
  let shownUrl = '';
  let started = false;       // the element has decoded something at least once

  const range = async (i, from, to) => {
    const c = index.chunks[i] || {};
    if (!c.url) throw new Error(`chunk ${i + 1} of ${n} has no url`);
    const headers = {};
    if (from || to !== undefined) headers.Range = `bytes=${from}-${to === undefined ? '' : to}`;
    const res = await fetch(c.url, { mode: 'cors', credentials: 'omit', headers });
    if (!res.ok) {
      const e = new Error(`chunk ${i + 1} of ${n}: HTTP ${res.status}`);
      e.httpStatus = res.status;
      throw e;
    }
    return new Uint8Array(await res.arrayBuffer());
  };
  const checkHash = async (bytes, payload, i) => {
    const c = index.chunks[i] || {};
    // Two writers, two conventions: tiktokupload.py hashes the WHOLE PNG it uploaded, a hand-built
    // index hashes the payload. Either digest proves the chunk is the one the index names.
    if (c.sha256 && (await sha256(bytes)) !== c.sha256 && (await sha256(payload)) !== c.sha256) {
      throw new Error(`chunk ${i + 1} of ${n} does not hash to the index`);
    }
  };
  const bytesNow = () => {
    if (have <= 1) return p0;
    return concat([p0, ...parts.slice(1, have)]);
  };
  const play = () => el.play().catch(() => { el.muted = true; el.play().catch(() => {  }); });
  // Swap in whatever is in hand. The position is carried across, or the picture would restart at 0
  // every time the prefix grows.
  const show = () => {
    if (!p0 || version === shownVersion) return;
    const at = el.currentTime || 0;
    const old = shownUrl;
    shownUrl = URL.createObjectURL(new Blob([bytesNow()], { type: mime }));
    if (at > 0.05) {
      el.addEventListener('loadedmetadata', () => { try { el.currentTime = at; } catch (e) { /* shorter */ } }, { once: true });
    }
    setMediaSource(el, shownUrl, mime);
    shownVersion = version;
    play();
    if (old) setTimeout(() => URL.revokeObjectURL(old), 60000);
  };
  const alive = (ms) => Promise.race([
    new Promise((ok) => {
      el.addEventListener('loadeddata', () => ok(true), { once: true });
      el.addEventListener('error', () => ok(false), { once: true });
    }),
    new Promise((ok) => setTimeout(() => ok(false), ms)),
  ]);
  const nearlyDry = () => (el.buffered.length
    ? el.buffered.end(el.buffered.length - 1) - (el.currentTime || 0) < TT_GRACE
    : false);
  // A truncated prefix does not politely stop at its last sample: Chrome raises MEDIA_ERR_DECODE
  // (measured 2026-10-23 — the 256 KB head plays ~50 ms and then errors) and the buffer empties,
  // which `nearlyDry()` would read as "nothing to do" and leave the player dead until the whole
  // file is in. So an error, or an empty buffer with more bytes in hand, is itself a reason to
  // extend the blob.
  const needsData = () => Boolean(el.error) || !el.buffered.length || nearlyDry();
  const ticker = setInterval(() => {
    if (version !== shownVersion && (shownVersion === 0 || needsData())) show();
  }, 750);

  try {
    // 1. the head — 256 KB, which is the moov plus the first frames of a faststart file
    const head = await range(0, 0, TT_HEAD - 1);
    // The rest of that part is asked for NOW, not after the head has proved it plays: waiting for
    // `loadeddata` first leaves the connection idle. One open-ended range, not a guessed span
    // split — the part is not always 5 MB (a fixture part of 3 MB, a 10 or 50 MB part are all real),
    // and a computed split would run past the end of a shorter one.
    const restP = head.length === TT_HEAD ? range(0, head.length) : Promise.resolve(null);
    p0 = chunkPayload(head);
    if (!p0) throw new Error('chunk 1 does not start with a PNG');
    version++;
    show();
    const headAlive = alive(4000);

    // 2. the rest of chunk 1 (never the first 256 KB twice), then what the head proved
    const rest = await restP;
    if (await headAlive) started = true;
    const whole = rest ? concat([head, rest]) : head;
    const payload0 = chunkPayload(whole);
    if (!payload0) throw new Error('chunk 1 is not a tt2png PNG');
    await checkHash(whole, payload0, 0);
    p0 = parts[0] = payload0;
    have = 1;
    version++;
    if (!started) { show(); if (await alive(2500)) started = true; }

    // 3. chunk 2..n, three ahead. A file whose moov is deep inside only starts once the prefix has
    //    reached it, so while nothing has decoded the blob is re-shown at 1, 2, 4, 8… chunks — one
    //    rebuild per doubling instead of one per chunk.
    const fetches = new Array(n);
    const pull = (i) => { if (i < n && !fetches[i]) { fetches[i] = range(i); fetches[i].catch(() => {}); } };
    let probeAt = 2;
    for (let i = 1; i < n; i++) {
      for (let k = i; k < Math.min(i + TT_AHEAD, n); k++) pull(k);
      const bytes = await fetches[i];
      const payload = chunkPayload(bytes);
      if (!payload) throw new Error(`chunk ${i + 1} of ${n} is not a tt2png PNG`);
      await checkHash(bytes, payload, i);
      parts[i] = payload;
      have = i + 1;
      version++;
      if (!started && have >= probeAt) {
        show();
        probeAt = Math.max(have + 1, have * 2);
        if (await alive(1500)) started = true;
      } else if (started && needsData()) {
        show();
      }
    }
    show();                                  // the whole file, so seeking and the end are real
  } catch (e) {
    clearInterval(ticker);
    document.title = `${index.name || 'file'} — ${e.message}`;
    throw e;
  }
  const stop = setInterval(() => { if (shownVersion === version) clearInterval(stop); else if (needsData()) show(); }, 750);
  return el;
}

// ─── the streaming path: ONE source, no reloads ────────────────────────────────────────────────
// The blob approach above re-sets <source src> and calls load() each time the prefix grows — the
// media element starts over, seeks back, and Chrome also raises MEDIA_ERR_DECODE at the end of every
// truncated blob (recorded live 2026-10-23: 4 rewrites and 2 decode errors in 20 s). His word for it
// was "it keeps refreshing the DOM on each part".
//
// So hand the bytes to the SERVICE WORKER instead: b2p-stream.js already streams a plan of parts
// with real Range support (it is what makes `/file/<name>` and `/<id>` playable at all). A tt2png
// index is such a plan — chunk urls, a capacity, a total — so the page writes it into the worker's
// plan cache, points the element at `/__b2p/stream/?id=<id>` and never touches the DOM again. The
// worker fetches each part's prefix on demand (`ttPartPayload`), windows open-ended ranges at 512 KB,
// and the browser's own media stack does the buffering. Seeking works: a Range from the middle maps
// to the part that holds it.
async function renderTt2pngStream(index, mime) {
  if (!('serviceWorker' in navigator) || !navigator.serviceWorker) return null;
  const swUrl = new URL('../b2p-stream.js', location.href).href;
  let reg;
  try { reg = await navigator.serviceWorker.register(swUrl, { scope: new URL('./', swUrl).href }); }
  catch (e) { return null; }                                   // file://, a private window, an http origin
  await Promise.race([navigator.serviceWorker.ready, new Promise((ok) => setTimeout(ok, 2500))]);
  if (!navigator.serviceWorker.controller) {
    await Promise.race([
      new Promise((ok) => navigator.serviceWorker.addEventListener('controllerchange', ok, { once: true })),
      new Promise((ok) => setTimeout(ok, 1500)),
    ]);
  }
  if (!navigator.serviceWorker.controller) return null;        // the first visit, before claim()

  const id = 'tt-' + (index.sha256 || '').slice(0, 16) + '-' + index.chunks.length;
  const plan = {
    id,
    name: index.name || 'file.mp4',
    mime,
    cap: Number(index.chunk_size) || 5000000,
    parts: index.chunks.map((c) => c.url),
    total: Number(index.bytes) || 0,
    tt: true,
  };
  const planHref = new URL('__b2p/plan/' + encodeURIComponent(id), swUrl).href;
  await (await caches.open('b2p-plan-v1')).put(planHref, new Response(JSON.stringify(plan), {
    headers: { 'Content-Type': 'application/json' },
  }));
  const streamUrl = new URL('__b2p/stream/?id=' + encodeURIComponent(id), swUrl).href;
  return { el: bareMedia(mime.startsWith('audio/') ? 'audio' : 'video'), streamUrl };
}

// The whole file at once — the non-media types, and the fallback when MediaSource cannot take it.
async function renderTt2png(index) {
  const mime = mimeFromName(index.name || '');
  if (!/^(video|audio)\//.test(mime)) return renderTt2pngFull(index);
  // The worker first: one source, one load(), no reloads. Anything that stops it being usable
  // (no worker, no control yet, a plan the worker refuses) falls back to the growing-blob player.
  try {
    const stream = await renderTt2pngStream(index, mime);
    if (stream) {
      setMediaSource(stream.el, stream.streamUrl, mime);
      const err = await Promise.race([
        new Promise((ok) => stream.el.addEventListener('error', () => ok(true), { once: true })),
        new Promise((ok) => setTimeout(() => ok(false), 6000)),
      ]);
      if (!err) { document.title = index.name || 'file'; return stream.el; }
      status('the stream worker could not serve this file — playing it from the parts instead.');
    }
  } catch (e) { /* the blob player below is the fallback, never a dead end */ }
  return renderTt2pngProgressive(index, mime);
}

async function renderTt2pngFull(index) {
  const pieces = [];
  for (let i = 0; i < index.chunks.length; i++) {
    const c = index.chunks[i] || {};
    if (!c.url) throw new Error(`chunk ${i + 1} of ${index.chunks.length} has no url`);
    const res = await fetch(c.url, { mode: 'cors', credentials: 'omit' });
    if (!res.ok) throw new Error(`chunk ${i + 1} of ${index.chunks.length}: HTTP ${res.status}`);
    const payload = chunkPayload(new Uint8Array(await res.arrayBuffer()));
    if (!payload) throw new Error(`chunk ${i + 1} of ${index.chunks.length} is not a tt2png PNG`);
    pieces.push(payload);
  }
  const bytes = concat(pieces);
  if (Number(index.bytes) && bytes.length !== Number(index.bytes)) {
    throw new Error(`the chunks hold ${bytes.length} B, the index says ${index.bytes} B`);
  }
  if (index.sha256 && (await sha256(bytes)) !== index.sha256) {
    throw new Error('the reassembled file does not hash to the index\u2019s sha256');
  }
  return renderBytes(bytes, index.name || 'file', '');
}

// Bytes with a name → the thing they are. One place, so a zip member and a plain payload render the
// same way (an HTML member becomes the document, an image is an image, text is text) — and each of
// them is BARE: no header, no type line, no meta line, exactly like opening the member from disk.
async function renderBytes(bytes, name, fromLabel) {
  const mime = mimeFromName(name) || sniffMime(bytes);
  if (mime === 'text/html') {
    window.__fileHtml = name;
    document.open();
    document.write(new TextDecoder().decode(bytes));
    document.close();
    return;
  }
  if (mime.startsWith('video/') || mime.startsWith('audio/')) {
    const el = bareMedia(mime.startsWith('audio/') ? 'audio' : 'video');
    setMediaSource(el, URL.createObjectURL(new Blob([bytes], { type: mime })), mime);
    return;
  }
  if (mime.startsWith('image/')) return bareImage(bytes, mime, name);
  if (mime.startsWith('text/') || mime === 'application/json' || mime === 'application/xml') {
    bareText(new TextDecoder().decode(bytes));
    return;
  }
  if (mime === 'application/pdf') {
    resetPage('');
    document.title = name;
    const embed = document.createElement('embed');
    embed.src = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    embed.type = 'application/pdf';
    embed.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0';
    document.documentElement.style.height = '100%';
    body.setAttribute('style', 'margin:0;height:100%;background:#000');
    body.appendChild(embed);
    return;
  }
  // Unknown binary: it has to say what it is and offer the bytes.
  resetPage('');
  document.title = name;
  const bar = document.createElement('div');
  const btn = document.createElement('button');
  btn.textContent = `⬇ Download ${name} (${fmt(bytes.length)})`;
  btn.addEventListener('click', () => saveBytes(bytes, name, mime));
  bar.appendChild(btn);
  body.appendChild(bar);
  status(`${mime || 'binary'} — this page cannot render it${fromLabel ? ` (from ${fromLabel})` : ''}.`);
}

// ─── a MASTER file ────────────────────────────────────────────────────────────────────────────
// `x-draft.py` writes a payload that is not a file but a LIST of files:
//   #bin2png-manifest v1
//   file\t<name>\t<bytes>\t<parts>\t<sha256>
//   part\t<n>\t<url>\t<id>
// bin2png.js has resolved these since 2026-10-17; this page showed one as "binary". Render what it
// names: the first entry, at the address the master was opened by.
function followManifest(bytes) {
  const text = new TextDecoder('utf-8', { fatal: false }).decode(bytes.subarray(0, 262144));
  if (!text.startsWith('#bin2png-manifest v1')) return null;
  const files = [];
  for (const line of text.split('\n')) {
    if (!line || line.startsWith('#')) continue;
    const f = line.split('\t');
    if (f[0] === 'file' && f.length >= 4) files.push({ name: f[1], parts: [] });
    // Column 3 is the pbs url (or its hash); column 4 is the NUMERIC media id upload returned, which
    // is NOT a pbs id — using it made `?format=png` 404 (his 2026-10-19: "not a valid image id").
    else if (f[0] === 'part' && f.length >= 3 && files.length) {
      files[files.length - 1].parts.push(f[2] || f[3]);
    }
  }
  const first = files.find((f) => f.parts.length);
  if (!first) return null;
  return {
    name: first.name || src.name,
    urls: first.parts.map((p) => (/^https?:/i.test(p) ? p : `https://pbs.twimg.com/media/${p}?format=png`)),
  };
}

// ─── an address that points at a LIST, not at the file ────────────────────────────────────────
// Two payloads name other payloads: a bin2png MASTER (`#bin2png-manifest v1`, one small part) and a
// tt2png INDEX (JSON naming chunks on a CDN, which also carries the archive's own listing).
// Following it is what makes the listing cost one small payload instead of every part — his
// 2026-10-25 report, `/file/HVdZdhhWUAAmCh6` (a 5.8 KB packed index for an 8.4 MB zip) read both
// chunks before it would show a single name. `head` is the payload's first bytes, which every
// caller has already read.
let indexHops = 0;
async function followIndex(head) {
  if (!head || src.tt || indexHops >= 2) return false;
  const plain = isPacked(head) ? (await unpackPrefix(head).catch(() => null)) || head : head;
  // 1. a MASTER: the file's parts, tab separated.
  if (isManifestHead(plain)) {
    const master = followManifest(await wholeFile());
    if (!master) return false;
    indexHops++;
    src = { ...src, name: master.name, urls: master.urls, direct: false, guess: false };
    partCache.clear();
    return true;
  }
  // 2. a tt2png INDEX. Only an ARCHIVE is taken over here: a media index keeps its own streaming
  //    player (renderMedia), which already reads ranges.
  const text = new TextDecoder('utf-8', { fatal: false }).decode(plain.subarray(0, 64)).trimStart();
  if (text.charAt(0) !== '{') return false;
  const index = parseTt2png(await wholeFile());
  if (!index || !/\.(zip|apk|jar)$/i.test(String(index.name || ''))) return false;
  indexHops++;
  src = { ...src, name: mimeFromName(src.name) ? src.name : (index.name || src.name),
          urls: index.chunks.map((c) => c.url), direct: false, guess: false, tt: index };
  partCache.clear();
  ttWhole.clear();
  ttPlan = null;
  return true;
}

// ─── the router ───────────────────────────────────────────────────────────────────────────────
let manifestDepth = 0;    // one hop only: a master that names a master is a bug, not a file
let pendingVideo = null;  // the optimistic player: the SAME element gets the real stream
let dictFreshOnce = false;  // one forced dictionary re-read per page, never a loop

// The address earned nothing: white, centred, the art, one way home — the page 404.html shows. The
// body is rebuilt first so a player or an index cannot sit underneath it.
// The rules live HERE, not in the stylesheet: a media address strips <head> whole (`bareHead`),
// and then a missing file used to paint in Times New Roman, hard against the left edge, with a
// default blue link (his 2026-10-19 report: "the not found is on the left now … click me to go home
// has not styled"). It is the SAME page 404.html shows: the art, then one way home.
const NOTFOUND_CSS = `
  html, body { margin:0; min-height:100%; background:#fff; color:#1b1b1f;
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; }
  p { margin:6px 0; }
  a { color:#0645ad; text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }
  #home { font-size:15px; }
`;
function show404() {
  pendingVideo = null;
  resetPage('notfound');
  // A media address left `html.media-address` (black) and a head with nothing in it. Rebuild both,
  // so every route ends on the identical page.
  document.documentElement.className = '';
  document.documentElement.removeAttribute('style');
  for (const n of [...document.head.childNodes]) n.remove();
  const meta = document.createElement('meta');
  meta.name = 'viewport';
  meta.content = 'width=device-width, initial-scale=1';
  const style = document.createElement('style');
  style.textContent = NOTFOUND_CSS;
  document.head.append(meta, style);
  document.title = '404 — not found';
  const img = document.createElement('img');
  img.src = siteUrl('404.png');
  img.alt = '404 — whatever you are looking for, it is not here';
  img.style.cssText = 'width:min(100%,420px);height:auto;display:block;margin:0 auto 8px';
  const home = document.createElement('p');
  home.id = 'home';
  const a = document.createElement('a');
  a.href = siteUrl('bin2png');
  a.textContent = 'click me to go home';
  home.appendChild(a);
  body.append(img, home);
}

// A player that IS the page: one element in <body>, the black window behind it, and the head and
// body a `file:///` media tab has. Both routes call this, so the element never moves — moving a
// <video> comes back as a fresh black frame (measured here).
function bareMedia(tag) {
  resetPage();
  // The black belongs to the WINDOW, not to a rule in a stylesheet: bareHead is about to remove
  // that stylesheet, and a transparent <html> is a frame that is not black (measured).
  document.documentElement.style.height = '100%';
  document.documentElement.style.background = '#000';
  body.setAttribute('style', 'margin:0;height:100%;background:#000;display:flex;' +
    'align-items:center;justify-content:center;overflow:hidden');
  bareHead('media');
  const el = document.createElement(tag);
  el.controls = true;
  el.autoplay = true;
  el.playsInline = true;
  el.setAttribute('name', 'media');
  el.setAttribute('style', 'display:block;max-width:100vw;max-height:100vh;background:#000');
  body.appendChild(el);
  pendingVideo = el;
  return el;
}

// Text is ONE <pre>, with the inline style Brave's own text tab gives it (measured 2026-10-19):
// `<pre style="word-wrap: break-word; white-space: pre-wrap;">`.
function bareText(text) {
  resetPage();
  bareHead('text');
  const pre = document.createElement('pre');
  pre.setAttribute('style', 'word-wrap: break-word; white-space: pre-wrap;');
  pre.textContent = text;
  body.appendChild(pre);
  return pre;
}

// An image tab in Brave is a dark canvas with the picture in the middle and its name and dimensions
// in the title (measured: `<html style="height:100%">`, body #0e0e0e, `img { display:block; margin:auto }`).
function bareImage(bytes, mime, name) {
  resetPage();
  bareHead('image');
  document.documentElement.style.height = '100%';
  body.setAttribute('style', 'margin:0;height:100%;background-color:#0e0e0e;' +
    'display:flex;align-items:center;justify-content:center');
  const img = document.createElement('img');
  img.setAttribute('style', 'display:block;margin:auto;max-width:100%;max-height:100%;' +
    '-webkit-user-select:none;cursor:zoom-in');
  img.alt = name;
  img.src = URL.createObjectURL(new Blob([bytes], { type: mime }));
  body.appendChild(img);
  img.addEventListener('load', () => {
    document.title = `${name} (${img.naturalWidth}×${img.naturalHeight})`;
  }, { once: true });
  return img;
}

function barePdf(bytes) {
  resetPage();
  document.documentElement.style.height = '100%';
  body.setAttribute('style', 'margin:0;height:100%;background:#000');
  const embed = document.createElement('embed');
  embed.src = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  embed.type = 'application/pdf';
  embed.style.cssText = 'display:block;width:100%;height:100%;border:0';
  body.appendChild(embed);
}

// A type this page cannot render: say it, and offer the bytes. The only view that needs a button.
function binaryView(bytes) {
  resetPage('');
  document.title = src.name;
  const btn = document.createElement('button');
  btn.textContent = `⬇ Download ${src.name} (${fmt(bytes.length)})`;
  btn.addEventListener('click', () => saveBytes(bytes, src.name, mimeFromName(src.name)));
  body.appendChild(btn);
  status(`${mimeFromName(src.name) || 'binary'} — this page cannot render it.`);
}

// `/file#name` and `/file/name` are the same address, spelled differently: the second is what the
// worker serves this page for (and what 404.html writes it into on a first visit), so the typed url
// is never rewritten. The `?name.ext` form is an id plus the filename it should save as.
function addressFromLocation() {
  const hash = location.hash.replace(/^#/, '');
  if (hash) return { raw: decodeURIComponent(hash).trim(), hint: '' };
  // `/file/<id>` and a bare `/<id>` at the site root are the same address; the second is the short

  const idAtRoot = /^\/[A-Za-z0-9_-]{10,}(?:\.[A-Za-z0-9]+)?\/?$/.test(location.pathname);
  const fromPath = (location.pathname.match(/\/file\/(.+)$/) || [])[1]
    || (idAtRoot ? location.pathname.slice(1) : '');
  const trailing = /\/$/.test(fromPath);
  const raw = fromPath ? decodeURIComponent(fromPath).replace(/\/+$/, '').trim() : '';
  let hint = location.search.replace(/^\?/, '');
  try { hint = decodeURIComponent(hint); } catch (e) { hint = ''; }
  if (!raw || !hint || hint.includes('=') || /[?#]/.test(hint)) hint = '';
  return { raw, hint, trailing };
}

async function run() {
  const where = addressFromLocation();
  let raw = where.raw;
  // Prefix grammar, left to right: `.` = an archive (its index page is up before the bytes arrive),
  // `,` = a video (its player is up before the bytes arrive). Both are his 2026-10-19 ask:
  // `/file/,<id>` prepares like the worker checks for webm/mp4, `/file/.<id>` is an archive.
  let ranged = false, forceMedia = false;
  for (;;) {
    if (raw.length > 1 && raw.startsWith('.')) { ranged = true; raw = raw.slice(1); continue; }
    if (raw.length > 1 && raw.startsWith(',')) { forceMedia = true; raw = raw.slice(1); continue; }
    break;
  }
  resetPage();
  if (!raw) {
    document.title = 'file';
    const p = document.createElement('p');
    p.textContent = 'Open a file by name: file#yakusoku.mp4, file#notes.txt, file#something.zip.';
    body.appendChild(p);
    return;
  }

  // The first frame is decided by the ADDRESS alone: `,` says video, an extension in the path or in
  // `?name` says which element, `.` says the index page. Nothing is fetched to find out.
  const firstMime = where.hint ? mimeFromName(where.hint) : (ranged ? '' : mimeFromName(raw));
  // The address AS TYPED, which is what every url this page writes keeps — an id stays an id, and

  const typedToken = raw.split('/')[0];
  let index = null;
  // A PATH inside an archive puts the empty `Index of /` up IMMEDIATELY, the way a `.` address does

  // already says so: there is a segment after the archive name, and a folder link always ends in `/`
  // (our own rows write it that way). A last segment with an extension is a FILE — those keep their
  // own blank tab and get no listing shell.
  if (!ranged && !forceMedia) {
    const inside = raw.includes('/');
    const lastSeg = raw.split('/').filter(Boolean).pop() || '';
    if (inside && (where.trailing || !/\.[A-Za-z0-9]{1,6}$/.test(lastSeg))) {
      index = indexView('/', 0, { base: typedToken });
    }
  }
  if (ranged) {
    // `.` says archive, the way `,` says video: an EMPTY `Index of /` is on screen before a byte is
    // read — the heading a file manager opens with — and the rows arrive when the directory does.

    index = indexView('/', 0, { base: typedToken });
  }
  let player = null;
  if (forceMedia) player = bareMedia('video');
  else if (/^(video|audio)\//.test(firstMime)) {
    player = bareMedia(firstMime.startsWith('audio/') ? 'audio' : 'video');
  }

  // Resolving decides whether the player/index stays or becomes the 404 art.
  // `/file/<base>/<member>` — the address may point INSIDE a zip (bug.gif in a zip of a game).
  // Try the whole token first (a dictionary name can contain a slash), then split at the first one.
  let token, member = null;
  try {
    token = await resolveToken(raw);
  } catch (e) {
    const cut = raw.indexOf('/');
    if (cut <= 0) {
      // NOT FOUND — and a dictionary one deploy behind is the one fixable reason: re-read it ONCE

      // loaded and it says 404, recache to check if video does actually exist").
      if (isNameToken(raw) && !dictFreshOnce) {
        dictFreshOnce = true;
        try {
          await dictionary(true);
          token = await resolveToken(raw);
        } catch (e2) { console.warn('address not resolved:', e2.message); show404(); return; }
      } else {

        console.warn('address not resolved:', e.message);
        show404();
        return;
      }
    } else {
      try {
        token = await resolveToken(raw.slice(0, cut));
        member = raw.slice(cut + 1);
      } catch (e2) { console.warn('address not resolved:', e2.message); show404(); return; }
    }
  }
  src = {
    name: where.hint || token.name || 'file',
    urls: token.urls,
    ranged,
    guess: !!token.guess,
    direct: /^https?:/i.test(raw) && token.urls.length === 1 && !/pbs\.twimg\.com\/media\//.test(raw),
  };
  // The part cache is keyed by PART NUMBER, so a hash change to a different file would read the
  // previous file's part 1 (measured: `#hello.txt` then `#bundle.zip` listed the text's bytes as the
  // zip's first member). A new address starts with an empty cache.
  partCache.clear();

  // "let the two ends decide" for a FILE whose name may lie — but here the resolved name already says
  // `.zip`, and probing it as an image decoded part 1 to 0 B (it is not an image at all), which threw
  // and replaced the `Index of /` shell with a bare download page.
  const namedArchive = /\.(zip|apk|jar)$/i.test(src.name);
  let mime = src.ranged && !namedArchive ? '' : mimeFromName(src.name);
  let zipByName = namedArchive;
  // A media or index view owns its own title (none for media, "Index of …" for an archive).
  // Assigning one here would insert a <title> INTO the bare head — measured: `META:viewport,TITLE:`.
  if (!player && !index) document.title = src.name;

  // An id carries no extension. Read the two ENDS before deciding — the last part says "zip" when
  // its EOCD ends exactly at the last byte, the first part says video/text/image. Never the whole

  if (!mime && !zipByName) {
    try {
      // TWO hops at most: an address can point at a LIST of parts (a master) or at a tt2png index,
      // and what gets rendered is the file that list NAMES. The head those probes read is what says
      // so — no second download.
      for (let hop = 0; hop < 2 && !mime && !zipByName; hop++) {
        const probe = await sniffSource();
        if (probe.packed) src.packed = true;
        if (probe.zip) { zipByName = true; break; }
        if (await followIndex(probe.head)) {
          // The index just named the file. If that name says `.zip`/`.apk`/`.jar` it IS an archive,
          // dot address or not — the same rule as `namedArchive` above, and the second half of the
          // 2026-10-25 live bug: following the index and then still refusing to list it.
          const nowArchive = /\.(zip|apk|jar)$/i.test(src.name);
          mime = src.ranged && !nowArchive ? '' : mimeFromName(src.name);
          zipByName = nowArchive;
          if (!player && !index) document.title = src.name;
          continue;
        }
        if (probe.mime) {
          mime = probe.mime;
          const ext = { 'video/mp4': 'mp4', 'video/x-matroska': 'mkv', 'video/webm': 'webm',
                        'audio/mpeg': 'mp3', 'audio/ogg': 'ogg', 'audio/flac': 'flac' }[mime] || '';
          // Only when the existing suffix is not already a media type: an id has none, `clip.dat`
          // has a useless one. The name is what a save will be called, so it should say what it is.
          if (ext && !mimeFromName(src.name)) src.name = `${src.name}.${ext}`;
        }
        break;
      }
    } catch (e) {
      // A failed probe still leaves the whole-file path — but say WHY on the console, or a broken
      // probe is invisible (it only shows up as a slow page).
      console.warn('probe failed:', e && e.message);
    }
    if (!player && !index) document.title = src.name;
  }

  // `id.mp4` where the id is not in the dictionary: pbs is the last word. One two-byte range says

  // 2026-10-19: "if pbs also is 404, then you can go to the 404 page").
  if (src.guess) {
    try {
      const res = await fetch(src.urls[0], {
        headers: { Range: 'bytes=0-1' }, mode: 'cors', credentials: 'omit',
      });
      if (res.status === 404 || res.status === 410) { show404(); return; }
    } catch (e) { /* offline or CORS: the player's own error handler decides */ }
  }

  try {
    if (/^(video|audio)\//.test(mime)) {
      await renderMedia(mime);
      return;
    }
    if (mime === 'application/zip' || zipByName) {
      if (player) player.remove();
      // A name that says `.zip` can still be an INDEX that names the archive — a tt2png index
      // carries the archive's own name (`Pictures.zip`). ONE part tells, and it is the part the
      // archive's own directory read would fetch anyway, so nothing is read twice.
      if (!src.tt && !src.direct && src.urls.length === 1) {
        await followIndex(await partPayload(0).catch(() => null));
      }
      // An id (or a `.bin`) has no archive suffix; the archive still saves as one.
      const label = /\.(zip|apk|jar)$/i.test(src.name) ? src.name : `${src.name}.zip`;
      // A path INSIDE the archive: `/file/<archive>/docs/readme.txt` or `/file/<archive>/docs/`.
      if (member) {
        // No resetPage() here: the folder page replaces the shell by building its own, and clearing
        // first is the white flash this whole change exists to remove.
        await renderZipPath(label, member, typedToken);
        return;
      }
      // The page is already up for a `.` address; only the rows were missing. Both branches carry
      // the ADDRESS it was opened by as the href base — without `base`, a listing opened by id wrote

      if (index) index.setLabel(label);
      else index = indexView(label, 0, { base: typedToken });
      // Hand the worker this archive's plan: from here on `/file/<archive>/<member>` is answered
      // with the member AS a file (its own type, `Content-Disposition: inline`, ranges).
      // Shared under the ADDRESS the rows link to, so the worker answers `/file/<id>/<member>`
      // without re-reading the archive's own directory first.
      shareArchivePlan(typedToken || label);
      // The rows: a tt2png index carries the archive's listing, so that copy costs no archive byte
      // at all; anything else reads the central directory (one tail range).
      fillFolder(index, '', await rootRows());
      return;
    }
    if (mime.startsWith('image/')) {
      bareImage(await wholeFile(), mime, src.name);
      return;
    }
    // Text, and anything else that is small enough to read: the bytes, then the bytes as text.
    // NOTHING is printed while it loads — a native tab is blank until the file is there.
    const bytes = await wholeFile();
    // A master file names parts; follow it once and render what it names.
    const master = manifestDepth < 1 ? followManifest(bytes) : null;
    if (master) {
      manifestDepth++;
      src = { name: master.name, urls: master.urls, direct: false, ranged: src.ranged };
      partCache.clear();
      const masterMime = mimeFromName(master.name);
      if (/^(video|audio)\//.test(masterMime)) return renderMedia(masterMime);
      return renderBytes(await wholeFile(), master.name, '');
    }
    document.title = src.name;
    // A tt2png index names chunks on a CDN — follow it and render the FILE it describes.
    const tt2png = parseTt2png(bytes);
    if (tt2png) return renderTt2png(tt2png);
    // An HTML payload IS a page: render it as the document, not as its source. document.open()/
    // write()/close() drops this page and lets the decoded page's own <style>/<script> run, with
    // relative urls resolved against this directory.
    if (mime === 'text/html') {
      window.__fileHtml = src.name;
      document.open();
      document.write(new TextDecoder().decode(bytes));
      document.close();
      return;
    }
    if (mime === 'application/pdf') { barePdf(bytes); return; }
    if (mime.startsWith('text/') || mime === 'application/json' || mime === 'application/xml') {
      bareText(new TextDecoder().decode(bytes));
      return;
    }
    binaryView(bytes);
  } catch (e) {
    // A 404 from the bytes IS a missing file, not a status line. His 2026-10-19 report:
    // `/file/nothinghere` is a 11-character token, so it passes the pbs-id test, pbs answers 404,
    // and the page printed "part 1: HTTP 404" instead of the art. The status line is left for
    // failures that are NOT "it is not there" (a decode error, a CORS block, an offline fetch).
    if (src.guess || e.httpStatus === 404 || e.httpStatus === 410) show404();
    else status(e.message, true);
  }
}

// The fallback for a zip that was deflated by the encoder: the archive is in memory anyway.
async function zipFromMemory(bytes) {
  let block = bytes, at = 0;
  if (isPacked(bytes)) block = await unpackPayload(bytes);
  const eocd = findEocd(block);
  if (eocd < 0) throw new Error('no zip end-of-directory record');
  const entries = u16(block, eocd + 10);
  const cdSize = u32(block, eocd + 12);
  const cdOff = u32(block, eocd + 16);
  return parseCentral(block, at, entries, cdSize, cdOff, block.length);
}

window.addEventListener('hashchange', run);
run();
</script>
</body>
</html>
