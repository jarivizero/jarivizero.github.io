<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirector</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body>
    <script>
        async function main() {
            const referrer = document.referrer.trim();
            
            if (!referrer) {
                window.location.href = "https://jarivizero.github.io/fails/the_decryption_failed"+referrer;
                return;
            }

            try {
                // 1. Hash referrer with SHA256
                const sha256 = CryptoJS.SHA256(referrer).toString(CryptoJS.enc.Hex);

                // 2. Fetch the hash list
                const response = await fetch('https://jarivizero.github.io/hash.txt');
                if (!response.ok) throw new Error('Failed to fetch hash list');
                
                const text = await response.text();
                const lines = text.trim().split('\n');

                let encryptedLink = null;

                // 3. Find matching SHA256 entry
                for (const line of lines) {
                    const [hash, enc] = line.split(':', 2);
                    if (hash && hash.trim() === sha256) {
                        encryptedLink = enc ? enc.trim() : null;
                        break;
                    }
                }

                if (!encryptedLink) {
                    window.location.href = "https://jarivizero.github.io/fails/the_decryption_failed"+referrer;
                    return;
                }

                // 4. Decrypt using referrer as AES key (CBC mode, PKCS7 padding)
                const key = CryptoJS.enc.Utf8.parse(referrer);
                // Use first 16 bytes of referrer as IV (or derive IV from hash if you prefer)
                const iv = CryptoJS.enc.Utf8.parse(referrer.substring(0, 16).padEnd(16, '0'));

                const decrypted = CryptoJS.AES.decrypt(encryptedLink, key, {
                    iv: iv,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.Pkcs7
                });

                const decryptedUrl = decrypted.toString(CryptoJS.enc.Utf8);

                // 5. Basic validation
                if (!decryptedUrl || !decryptedUrl.startsWith('http')) {
                    window.location.href = "https://jarivizero.github.io/fails/the_decryption_failed"+referrer;
                    return;
                }

                // 6. Redirect to valid decrypted link
                window.location.href = decryptedUrl;

            } catch (e) {
                console.error(e);
                window.location.href = "https://jarivizero.github.io/fails/the_decryption_failed"+referrer;
            }
        }

        // Run when page loads
        window.onload = main;
    </script>
</body>
</html>
