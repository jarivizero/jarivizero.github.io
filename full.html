<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Video</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="
https://video-s.twimg.com/amplify_video/2043985040355536897/vid/avc1/1280x536/8s1K4yOWJ5apfNPQ.mp4" 
        referrerpolicy="no-referrer"
        allow="autoplay; fullscreen" 
        allowfullscreen>
    </iframe >

</body>
</html>
