<script>
(function () {
  'use strict';

  var here = location.pathname;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];

  }
  function human(n) {
    n = Number(n) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(2) + ' GB';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + ' MB';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + ' kB';
    return n + ' B';
  }
  function fmtDate(text) {
    var d = text ? new Date(text) : null;
    if (!d || isNaN(d.getTime())) return '';
    var p = function (n) { return String(n).padStart(2, '0'); };
    var h = d.getHours();
    return (d.getMonth() + 1) + '/' + d.getDate() + '/' + String(d.getFullYear()).slice(2) + ', '
      + ((h % 12) || 12) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds())
      + ' ' + (h >= 12 ? 'PM' : 'AM');
  }
  var NAME = decodeURIComponent((here.split('/').filter(Boolean).pop() || ''));
  var keyPromise = null;
  function sha256hex(text) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
    });
  }
  function archiveKey() {
    if (!keyPromise) keyPromise = sha256hex(NAME);
    return keyPromise;
  }
  function rpc(fn, body) {
    return archiveKey().then(function (k) {
      var payload = Object.assign({ p_key: k }, body || {});
      return fetch(SUPA + '/rest/v1/rpc/' + fn, {
        method: 'POST', cache: 'no-store',
        headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY },
        body: JSON.stringify(payload)
      }).then(function (r) {
        if (!r.ok) throw new Error(fn + ' -> HTTP ' + r.status);
        return r.json();
      });
    });
  }
  function noKey() {
    document.querySelectorAll('body > *').forEach(function (n) {
      if (n.id !== 'header' && n.id !== 'count') n.remove();
    });
    header.textContent = 'Index of ' + here;
    countEl.textContent = 'no such archive here';
    document.title = 'Index of ' + here;
  }

  function payloadOf(u8) {                     // the bytes after the 1x1 PNG's IEND
    var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    var off = 8;
    while (off + 8 <= u8.length) {
      var len = dv.getUint32(off);
      var type = String.fromCharCode(u8[off + 4], u8[off + 5], u8[off + 6], u8[off + 7]);
      var end = off + 8 + len + 4;
      if (type === 'IEND') return u8.subarray(Math.min(end, u8.length));
      if (end > u8.length) break;
      off = end;
    }
    return u8;
  }
  async function gunzip(u8) {
    if (typeof DecompressionStream !== 'function') throw new Error('this browser cannot inflate gzip');
    var stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  var byteCache = new Map();
  async function bytesOf(file, cell) {
    if (byteCache.has(file.path)) return byteCache.get(file.path);
    var label = cell ? cell.textContent : '';
    var parts = [], total = 0;
    for (var i = 0; i < file.chunks.length; i++) {
      var c = file.chunks[i];
      if (cell) cell.textContent = 'reading ' + (i + 1) + '/' + file.chunks.length + '…';
      var res = await fetch(c.u, { cache: 'no-store' });
      if (!res.ok) throw new Error('chunk ' + (i + 1) + ' -> HTTP ' + res.status);
      var body = payloadOf(new Uint8Array(await res.arrayBuffer()));
      if (c.k) { for (var j = 0; j < body.length; j++) body[j] ^= c.k; }
      if (c.g) body = await gunzip(body);
      parts.push(body);
      total += body.length;
    }
    if (total !== Number(file.bytes)) {
      throw new Error('size mismatch: got ' + total + ' B, the row says ' + file.bytes + ' B');
    }
    var bytes = new Uint8Array(total), at = 0;
    parts.forEach(function (p) { bytes.set(p, at); at += p.length; });
    byteCache.set(file.path, bytes);
    if (cell) cell.textContent = label;
    return bytes;
  }
  function saveBytes(bytes, name, mime) {
    var url = URL.createObjectURL(mime ? new Blob([bytes], { type: mime }) : new Blob([bytes]));
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 60000);
  }
  async function download(file, cell) {
    msg.textContent = '';
    var label = cell.textContent;
    try {
      saveBytes(await bytesOf(file, cell), file.path.split('/').pop());
    } catch (e) {
      msg.textContent = 'download failed: ' + e.message;
    }
    cell.textContent = label;
  }

  function u16(b, o) { return b[o] | (b[o + 1] << 8); }
  function u32(b, o) {
    return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
  }
  function findEocd(b) {
    for (var i = b.length - 22; i >= 0; i--) if (u32(b, i) === 0x06054b50) return i;
    return -1;
  }
  function readZipEntries(b) {
    var eocd = findEocd(b);
    if (eocd < 0) throw new Error('no end-of-directory record — this is not a zip');
    var count = u16(b, eocd + 10), at = u32(b, eocd + 16), out = [], dec = new TextDecoder();
    for (var k = 0; k < count && at + 46 <= b.length; k++) {
      if (u32(b, at) !== 0x02014b50) break;
      var nlen = u16(b, at + 28), xlen = u16(b, at + 30), clen = u16(b, at + 32);
      var name = dec.decode(b.subarray(at + 46, at + 46 + nlen)).replace(/\\/g, '/');
      out.push({
        name: name, method: u16(b, at + 10), csize: u32(b, at + 20), usize: u32(b, at + 24),
        offset: u32(b, at + 42), dir: /\/$/.test(name),
        time: u16(b, at + 14) | (u16(b, at + 12) << 16)
      });
      at += 46 + nlen + xlen + clen;
    }
    return out;
  }
  function dosDate(e) {
    var d = (e.time >> 16) & 0xffff, t = e.time & 0xffff;
    if (!d) return null;
    return new Date(1980 + ((d >> 9) & 0x7f), ((d >> 5) & 0xf) - 1, d & 0x1f,
      (t >> 11) & 0x1f, (t >> 5) & 0x3f, (t & 0x1f) * 2);
  }
  async function memberBytes(zip, e) {
    var b = zip.bytes, lh = e.offset;
    if (u32(b, lh) !== 0x04034b50) throw new Error('bad local header for ' + e.name);
    var start = lh + 30 + u16(b, lh + 26) + u16(b, lh + 28);
    var comp = b.subarray(start, start + e.csize);
    if (e.method === 0) return comp.slice();
    if (e.method === 8) {
      var ds = new DecompressionStream('deflate-raw');
      return new Uint8Array(await new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer());
    }
    throw new Error('member uses compression method ' + e.method);
  }
  var MIME = {
    html: 'text/html', htm: 'text/html', txt: 'text/plain', log: 'text/plain', json: 'application/json',
    xml: 'text/xml', csv: 'text/csv', js: 'text/javascript', css: 'text/css',
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp',
    svg: 'image/svg+xml', ico: 'image/x-icon', pdf: 'application/pdf', mp4: 'video/mp4',
    webm: 'video/webm', mp3: 'audio/mpeg', pcap: 'application/vnd.tcpdump.pcap'
  };
  function mimeOf(name) {
    var ext = (name.split('.').pop() || '').toLowerCase();
    var m = MIME[ext];
    if (m === 'application/vnd.tcpdump.pcap') return '';      // no viewer for a capture: download
    return m || '';
  }

  var lastReport = null, currentId = null, currentZip = null, zipCache = new Map();

  async function openMember(e, cell) {
    var label = cell.textContent, win = window.open('', '_blank');
    try {
      cell.textContent = 'extracting…';
      var bytes = await memberBytes(currentZip, e);
      var name = e.name.split('/').pop(), mime = mimeOf(name);
      if (mime && win) {
        win.location = URL.createObjectURL(new Blob([bytes], { type: mime }));
      } else {
        if (win) win.close();
        saveBytes(bytes, name, mime || undefined);
      }
      cell.textContent = label;
    } catch (err) {
      if (win) win.close();
      msg.textContent = 'cannot read ' + e.name + ': ' + err.message;
      cell.textContent = label;
    }
  }

  async function loadZip(file, cell) {
    if (zipCache.has(file.path)) return zipCache.get(file.path);
    var z = { bytes: await bytesOf(file, cell), entries: [] };
    z.entries = readZipEntries(z.bytes);
    zipCache.set(file.path, z);
    return z;
  }
  function zipAddress(path, prefix) {
    return '?r=' + encodeURIComponent(currentId) + '&z=' + encodeURIComponent(path)

  }
  async function openZipPath(path, prefix) {
    var f = ((lastReport && lastReport.files) || []).filter(function (x) { return x.path === path; })[0];
    if (!f) { msg.textContent = 'no ' + path + ' in this submission'; return; }
    try {
      currentZip = await loadZip(f, null);
      drawZip(path, prefix || '');
    } catch (e) {
      msg.textContent = 'cannot open this zip: ' + e.message;
    }
  }
  async function openZip(file, cell) {
    msg.textContent = '';
    try {
      currentZip = await loadZip(file, cell);
      history.replaceState(null, '', zipAddress(file.path, ''));
      drawZip(file.path, '');
    } catch (e) {
      msg.textContent = 'cannot open this zip: ' + e.message;
      if (cell) cell.textContent = file.path.split('/').pop();
    }
  }

  function drawZip(path, prefix) {
    var z = zipCache.get(path);
    if (!z) return;
    var base = path.split('/').pop();
    header.textContent = 'Index of ' + here + '/' + currentId + '/' + base + '/'
      + prefix;
    document.title = 'Index of ' + base + '/' + prefix;
    tbody.textContent = '';
    parentBox.hidden = false;
    parentDirLink.href = prefix
      ? zipAddress(path, prefix.replace(/[^/]+\/$/, ''))
      : '?r=' + encodeURIComponent(currentId);
    var dirs = {}, files = [], total = 0;
    z.entries.forEach(function (e) {
      if (prefix && e.name.indexOf(prefix) !== 0) return;
      var rest = e.name.slice(prefix.length);
      if (!rest || rest === '/') return;
      var cut = rest.indexOf('/');
      if (cut >= 0) dirs[rest.slice(0, cut + 1)] = true;
      else if (!e.dir) files.push(e);
    });
    Object.keys(dirs).sort().forEach(function (d) {
      var cells = row(zipAddress(path, prefix + d), d, '', '', '', 'icon dir', [d, 0, 0, '']);
      cells.name.firstChild.addEventListener('click', function (ev) {
        ev.preventDefault();

      });
    });

      var label = e.name.slice(prefix.length), d = dosDate(e);

  function row(nameHref, nameText, date, size, details, iconClass, sortKeys) {
    var tr = document.createElement('tr');
    if (sortKeys) tr._sort = sortKeys;
    var td = document.createElement('td');
    var a = document.createElement('a');

    t2.className = 'detailsColumn';
    t2.textContent = date || '';

  var index = { rows: [], cursor: null, done: false, loading: false, q: '', bytes: 0, files: 0 };

  function loadIndex(reset) {
    if (index.loading) return Promise.resolve();
    if (reset) { index.rows = []; index.cursor = null; index.done = false; index.bytes = 0; index.files = 0; }
    if (index.done) return Promise.resolve();
    index.loading = true;
    var body = { p_limit: PAGE_N, p_q: index.q || null };
    if (index.cursor) {
      body.p_before = index.cursor.created_at;
      body.p_before_id = index.cursor.sample_id;
    }
    return rpc('triage_index', body).then(function (page) {
      index.loading = false;
      if (!page || !page.length) { index.done = true; return; }

        index.rows.push(r);
        index.bytes += Number(r.bytes || 0);
        index.files += Number(r.files || 0);

    }).catch(function (e) {

    header.textContent = 'Index of ' + here;
    document.title = 'Index of ' + here;
    countEl.textContent = (index.done ? index.rows.length : 'at least ' + index.rows.length)

        fmtDate(r.created_at), String(r.files) + ' file(s)', human(r.bytes), 'icon dir',

      anchor.addEventListener('click', function (ev) {
        ev.preventDefault();
        if (isZip) openZip(f, anchor); else download(f, anchor);
      });
    });
    var cells = row('#', 'manifest.json', '', '', 'manifest.json', 'icon file',
      ['manifest.json', 0, 0, 0]);
    cells.name.firstChild.addEventListener('click', function (ev) {
      ev.preventDefault();
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(rep, null, 2)],
        { type: 'application/json' }));
      a.download = id + '.json';
      a.click();
    });
  }

  var sortState = { col: null, dir: 1 };
  function applySort() {
    if (sortState.col === null) return;
    var rows = Array.prototype.slice.call(tbody.children).filter(function (tr) {
      return tr.id !== 'moreRow';
    });
    rows.sort(function (a, b) {
      var A = (a._sort || [])[sortState.col], B = (b._sort || [])[sortState.col];
      if (typeof A === 'number' && typeof B === 'number') return (A - B) * sortState.dir;
      return String(A == null ? '' : A).localeCompare(String(B == null ? '' : B), undefined,
        { numeric: true }) * sortState.dir;
    });
    rows.forEach(function (tr) { tbody.appendChild(tr); });
    var more = document.getElementById('moreRow');
    if (more) tbody.appendChild(more);
  }
  var THS = document.querySelectorAll('#table thead th');
  Array.prototype.forEach.call(THS, function (th, col) {
    th.addEventListener('click', function () {
      if (sortState.col === col) sortState.dir = -sortState.dir;
      else { sortState.col = col; sortState.dir = 1; }
      Array.prototype.forEach.call(THS, function (h) {
        var a = h.querySelector('.arrow');
        if (a) a.remove();
      });
      var arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = sortState.dir > 0 ? ' \u25b2' : ' \u25bc';
      th.appendChild(arrow);
      applySort();
    });
  });

  var m = /[?&]r=([^&]+)/.exec(location.search);
  if (m) {
    currentId = decodeURIComponent(m[1]).replace(/\/$/, '');
    countEl.textContent = 'loading ' + currentId + '…';
    rpc('triage_report', { p_sample: currentId }).then(function (rep) {
      if (!rep) { noKey(); return; }
      drawReport(currentId, rep);
      var zp = /[?&]z=([^&]*)/.exec(location.search);
      if (zp) {
        var pp = /[?&]p=([^&]*)/.exec(location.search);
        return openZipPath(decodeURIComponent(zp[1]), pp ? decodeURIComponent(pp[1]) : '');
      }
    }).catch(function (e) { msg.textContent = 'folder read failed: ' + e.message; });
  } else {
    loadIndex(true).then(function () {
      if (!index.rows.length) noKey();
    });
  }
})();
</script>
