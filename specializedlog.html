<script>
(async function () {
  var m = document.getElementById('m');
  var b64u = function (s) {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    return Uint8Array.from(atob(s + '='.repeat((4 - s.length % 4) % 4)), function (c) { return c.charCodeAt(0); });
  };
  try {
    var pass = decodeURIComponent(location.search.replace(/^\?/, ''));
    var parts = document.getElementById('ct').textContent.trim().split('.');
    if (parts[0] !== 'v1' || !parts[1] || !parts[2]) throw new Error('no blob');
    var key = await crypto.subtle.importKey('raw',
      await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pass)), 'AES-GCM', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u(parts[1]) }, key, b64u(parts[2]));
    document.open();
    document.write(new TextDecoder().decode(plain));
    document.close();
  } catch (e) {
    m.textContent = 'specialized: wrong password (or this browser has no WebCrypto).';
  }
})();
</script>
