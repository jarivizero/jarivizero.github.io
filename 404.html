<noscript><style>html.file-address body > main { display:block; }</style></noscript>
<script>
(function () {
  const path = location.pathname;
  const inFile = path.match(/\/file\/(.+)$/);
  const idAtRoot = /^\/[A-Za-z0-9_-]{10,}(?:\.[A-Za-z0-9]+)?\/?$/.test(path);
  if (!inFile && !idAtRoot) return;
  const address = decodeURIComponent(inFile ? inFile[1] : path.slice(1)).replace(/\/+$/, '').trim();
  let hint = location.search.replace(/^\?/, '');
  try { hint = decodeURIComponent(hint); } catch (e) { hint = ''; }
  let raw = address;                       // the prefix grammar: `.` archive, `,` video
  for (;;) {
    if (raw.length > 1 && (raw.charAt(0) === '.' || raw.charAt(0) === ',')) { raw = raw.slice(1); continue; }
    break;
  }
  const forcedMedia = address.charAt(0) === ',';
  const name = hint && !hint.includes('=') && !/[?#]/.test(hint) ? hint : raw;
  const ext = (name.match(/\.([A-Za-z0-9]+)$/) || [])[1];
  const e = ext ? ext.toLowerCase() : '';
  const MEDIA = ['mp4','m4v','mov','webm','mkv','avi','mp3','m4a','aac','ogg','oga','opus','flac','wav'];
  const IMAGE = ['png','jpg','jpeg','gif','webp','bmp','avif','ico','svg'];
  let kind = 'id';
  if (forcedMedia || MEDIA.includes(e)) kind = 'media';
  else if (raw.charAt(0) === '.') kind = 'text';
  else if (e) kind = IMAGE.includes(e) ? 'image' : 'text';
  document.documentElement.className = 'file-' + kind;
  document.documentElement.classList.add('file-address');
  if (kind === 'text') {
    const meta = document.createElement('meta');
    meta.name = 'color-scheme';
    meta.content = 'light dark';
    document.head.appendChild(meta);
  }
  window.__fileKind = kind;               // the video frame below is built only for `media`
})();
</script>

  const art = document.getElementById('art');
  const msg = document.getElementById('msg');
  const home = document.getElementById('home');
  const stage = document.getElementById('stage');
  const fail = (text) => {
    showArt();
    msg.className = 'msg error';
    msg.textContent = text;
    home.innerHTML = '<a href="/bin2png">click me to go home</a>';
  };
  let artAsked = false;
  function showArt() {
    if (artAsked) return;
    artAsked = true;
    art.src = '/404.png';
  }

  function dictMap(text) {
    const map = new Map();
    for (const line of String(text || '').split('\n')) {
      const t = line.trim();
      if (!t || t.startsWith('#')) continue;
      const p = t.split(/\s+/);
      if (p.length === 3 && p[0] === 'v1') map.set(p[1], p[2]);
    }
    return map;
  }
  const BAKED = dictMap(DICT_INLINE);
  async function digestHex(text) {
    if (!(self.crypto && crypto.subtle)) return '';
    const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  function cleanToken(name) {
    let t = String(name || '').replace(/\/+$/, '').trim();
    for (;;) {
      if (t.length > 1 && (t.charAt(0) === '.' || t.charAt(0) === ',')) { t = t.slice(1); continue; }
      break;
    }
    return t.replace(/^(?:n|name|id):/i, '');
  }
  async function knownName(bare) {
    if (!BAKED.size || !bare) return !BAKED.size;
    const h = await digestHex(bare);
    return !!h && BAKED.has(h);
  }
  function looksLikeId(bare) {
    const t = String(bare || '').trim();
    if (!t) return false;
    if (/^https?:/i.test(t)) return true;
    return t.split('+').map((s) => s.trim()).filter(Boolean)
      .every((p) => /^[A-Za-z0-9_-]{15}$/.test(p.replace(/\.[A-Za-z0-9]+$/, '')));
  }
  function handOverToWorker(name) {
    const key = 'b2p-cold:' + location.href;
    try {
      if (!('serviceWorker' in navigator) || !window.isSecureContext) return Promise.resolve(false);
      if (sessionStorage.getItem(key)) return Promise.resolve(false);
      sessionStorage.setItem(key, '1');
    } catch (e) { return Promise.resolve(false); }   // no storage, no hand-over: never a loop
    return new Promise((resolve) => {
      const deadline = Date.now() + 2500;
      const tick = async () => {
        if (REG && (await REG) === null) { resolve(false); return; }
        if (!navigator.serviceWorker.controller) {
          if (Date.now() > deadline) { resolve(false); return; }
          setTimeout(tick, 100);
          return;
        }
        let serveable = false;
        try {
          const r = await fetch(location.href, { cache: 'no-store', headers: { Range: 'bytes=0-1' } });
          serveable = r.status === 200 || r.status === 206;
        } catch (e) { }
        if (serveable) {
          resolve(true);
          location.replace(location.href);      // the worker answers THIS one, with the file
          return;

        try {
          const seg = decodeURIComponent((location.pathname.split('/').filter(Boolean).pop() || ''));
          if (seg && (await supaIndex(seg))) { resolve(true); location.replace(location.href); return; }
        } catch (e) { }
        resolve('missing');
      };
      tick();

  function waitForController(ms) {
    if (!('serviceWorker' in navigator)) return Promise.resolve(false);
    if (navigator.serviceWorker.controller) return Promise.resolve(true);
    return new Promise((resolve) => {
      const done = () => resolve(!!navigator.serviceWorker.controller);
      const t = setTimeout(done, ms);

    webp:'image/webp', avif:'image/avif', bmp:'image/bmp', mp4:'video/mp4', m4v:'video/mp4',

    csv:'text/csv', html:'text/html', zip:'application/zip', apk:'application/vnd.android.package-archive' };
  function b64u(text) {
    const s = String(text || '').replace(/-/g, '+').replace(/_/g, '/');

    let off = 8;
    while (off + 8 <= bytes.length) {
      const len = dv.getUint32(off);
      const type = String.fromCharCode(bytes[off + 4], bytes[off + 5], bytes[off + 6], bytes[off + 7]);

      if (type === 'IEND') return bytes.subarray(Math.min(end, bytes.length));

  async function directLoad(address) {
    if (!(self.crypto && crypto.subtle)) return false;

    msg.textContent = '';
    home.textContent = '';

      document.body.style.cssText = 'margin:0;padding:0;background:#000;display:block';
      document.body.appendChild(v);
      return true;

      document.body.textContent = '';
      document.body.style.cssText = 'margin:0;padding:0;background:#121212;display:block;height:100%';

      stage.appendChild(pre);

    a.href = url; a.download = file; a.textContent = 'Download ' + file;
    stage.textContent = '';

  async function openRenderer(name, root) {

      v.playsInline = true;

                        'object-fit:contain;background:#000';

  const asRoot = !asPath && /^\/[A-Za-z0-9_-]{10,}(?:\.[A-Za-z0-9]+)?\/?$/.test(location.pathname);
  if (asPath || asRoot) {
    const name = (asPath ? asPath[1] : location.pathname.slice(1)).replace(/\/+$/, '');

    const bare = cleanToken(name).split('/')[0] || '';

    if (await knownName(bare) || looksLikeId(bare) || ARCHIVE_EXT.test(bare) || name.includes('/')) {

      try { if (await directLoad(name)) return; } catch (e) { }

    const handover = await handOverToWorker(name);
    if (handover === true) return;
    if (/^[A-Za-z0-9]{4}$/.test(bare)) { await openRenderer(name, root); return; }
    if (handover === false) {
      try { if (await directLoad(name)) return; } catch (e) { }
    }
    document.documentElement.className = '';      // the art is not a player's black frame
    showArt();
    msg.textContent = '';
    document.title = '404 — not found';
    try {
      const ver = await fetch(root + 'sw-ver.txt', { cache: 'no-store' });
      if (ver.ok && 'serviceWorker' in navigator) {
        const live = (await ver.text()).trim();
        const reg = await navigator.serviceWorker.getRegistration().catch(() => null);
        const w = reg && (reg.active || reg.waiting || reg.installing);
        if (live && w) w.postMessage({ type: 'resync', ver: live });
      }
    } catch (e) { }
    try {
      const res = await fetch(root + 'IDSDICTIONARY.txt?fresh=' + Date.now(), { cache: 'no-store' });
      if (res.ok) {
        const fresh = dictMap(await res.text());
        const h = await digestHex(bare);
        if (h && fresh.has(h)) await openRenderer(name, root);
      }
    } catch (e) { }
    return;
  }
  if (location.pathname === '/file/') { location.replace('/file'); return; }

  if (location.pathname.includes('/__b2p/')) {
    msg.className = 'msg';
    msg.textContent = 'Preparing the stream…';
    home.textContent = '';
    if (!('serviceWorker' in navigator) || !window.isSecureContext) {
      fail('This browser cannot install the worker the stream needs.');
      return;
    }
    try {
      await navigator.serviceWorker.register(SW_URL, { scope: '/' });
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller) {
        await new Promise((res) => {
          const t = setTimeout(res, 10000);
          navigator.serviceWorker.addEventListener('controllerchange', () => { clearTimeout(t); res(); }, { once: true });
        });
      }
      if (!navigator.serviceWorker.controller) {
        fail('The worker installed but did not take control of this page. Reload it once.');
        return;
      }
      const probe = await fetch(location.href, { headers: { Range: 'bytes=0-1' }, cache: 'no-store' });
      if (probe.status === 206 || probe.status === 200) {
        msg.textContent = 'Stream ready — opening it.';
        location.replace(location.href);
        return;
      }
      if (probe.status === 410) {
        fail('This address carries no streaming plan, and this browser has not opened that file ' +
             'before. Open it from /file (or /bin2png) by its name first.');
        return;
      }
      fail(`The worker answered HTTP ${probe.status} for this address.`);
    } catch (e) {
      fail(`The worker could not be installed: ${e.message}`);
    }
    return;
  }

  showArt();
  msg.textContent = '';
})();
</script>
</body>
</html>
