<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — not found</title>
<script>
// BEFORE THE FIRST PAINT. `/file/<name>` is a file address dressed as a path: this document is only
// the frame around the renderer, so it must never paint the 404 art or the home link on its way to
// the payload (his 2026-10-19 report: "will still load a page, then a video loading"). `/<id>` at the

//
// WHICH frame is decided by the ADDRESS ALONE, and a text address is a TEXT frame: black is right for
// a player and wrong for a .txt, whose tab is white in light mode and dark in dark mode because of
// `<meta name="color-scheme" content="light dark">` (his 2026-10-19 ask: "it does this for video
// files but txt have a special style"). The kinds mirror file.html's pre-paint — keep the two lists
// in step; they are the same decision made twice, once for the server's 404 and once for the worker's
// precached renderer.
(function () {
  const path = location.pathname;
  const inFile = path.match(/\/file\/(.+)$/);
  const idAtRoot = /^\/[A-Za-z0-9_-]{10,}(?:\.[A-Za-z0-9]+)?\/?$/.test(path);
  if (!inFile && !idAtRoot) return;
  const address = decodeURIComponent(inFile ? inFile[1] : path.slice(1)).replace(/\/+$/, '').trim();
  let hint = location.search.replace(/^\?/, '');
  try { hint = decodeURIComponent(hint); } catch (e) { hint = ''; }
  let raw = address;                       // the prefix grammar: `.` archive, `,` video
  for (;;) {
    if (raw.length > 1 && (raw.charAt(0) === '.' || raw.charAt(0) === ',')) { raw = raw.slice(1); continue; }
    break;
  }
  const forcedMedia = address.charAt(0) === ',';
  const name = hint && !hint.includes('=') && !/[?#]/.test(hint) ? hint : raw;
  const ext = (name.match(/\.([A-Za-z0-9]+)$/) || [])[1];
  const e = ext ? ext.toLowerCase() : '';
  const MEDIA = ['mp4','m4v','mov','webm','mkv','avi','mp3','m4a','aac','ogg','oga','opus','flac','wav'];
  const IMAGE = ['png','jpg','jpeg','gif','webp','bmp','avif','ico','svg'];
  // `id` = an address with no extension at all: nothing is known yet, and black is the better guess
  // (an id is usually a player); file.html's own pre-paint clears it if the sniff says otherwise.
  let kind = 'id';
  if (forcedMedia || MEDIA.includes(e)) kind = 'media';
  else if (raw.charAt(0) === '.') kind = 'text';
  else if (e) kind = IMAGE.includes(e) ? 'image' : 'text';
  document.documentElement.className = 'file-' + kind;
  if (kind === 'text') {
    const meta = document.createElement('meta');
    meta.name = 'color-scheme';
    meta.content = 'light dark';
    document.head.appendChild(meta);
  }
  window.__fileKind = kind;               // the video frame below is built only for `media`
})();
</script>
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --muted:#666; --accent:#0645ad; }
  html.file-media, html.file-media body { background:#000; }
  html.file-image, html.file-image body { background:#0e0e0e; }
  /* `file-text` and `file-id` set no colour on purpose: the canvas comes from the color-scheme meta
     (light mode white, dark mode near-black), which is what a `file:///` tab does. */
  html.file-path body > main { display:none; }   /* the iframe is a child of body, and must show */
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; }
  body { display:flex; align-items:center; justify-content:center; padding:24px; }
  main { text-align:center; max-width:560px; }
  img { width:min(100%, 420px); height:auto; display:block; margin:0 auto 8px; }
  p { margin:6px 0; color:var(--muted); }
  p.msg { color:var(--fg); }
  p.msg.error { color:#b42318; }
  a { color:var(--accent); text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }
  #home { font-size:15px; }
</style>
</head>
<body>
<main id="stage">
  <img id="art" src="/404.png" alt="404 — whatever you are looking for, it is not here">
  <p class="msg" id="msg"></p>
  <p id="home"><a href="/bin2png">click me to go home</a></p>
</main>
<script>
'use strict';
// 404.html — one page with three jobs, all of them "the url was not a file".
//
// 1. `/file/<name>` — the path spelling of a renderer address. The renderer is loaded in place, so
//    the address a person typed and will copy stays exactly what it is (a redirect to `/file#<name>`
//    would rewrite it).
// 2. `/__b2p/<name>?…` — a STREAM address. Its answer lives in `b2p-stream.js`, and a browser only
//    asks a service worker after registering one. A visitor who never opened /file or /bin2png has
//    no worker, so this page installs it, waits for it to control the page, proves the address
//    answers a byte range, and reloads — the reload is served by the worker and the video plays.
//    The plan rides in the url (`p=` ids, `u=` urls, `m=` type), so nothing has to be cached here.
// 3. anything else — the 404 art (catbox.moe's), and one way home.
// Install the worker on ANY 404, not only a stream address: a file address (`/file/<name>`, `/<id>`)
// reached later is then answered from the worker's own copy instead of waiting for this page again.
// Fire and forget — nothing on this page waits for it.
//

// "broke" `/TwitterMP4Extractor` and other pages on this origin): this page IS GitHub's answer for
// anything that is not a file, and a worker that guessed the same thing ate every page it did not
// happen to know about.
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('/b2p-stream.js', { scope: '/' }).catch(() => {});
}

(async () => {
  // Everything this page needs lives INSIDE this function. `/file/<name>` replaces this document
  // with the renderer (`document.open()` keeps the same window and its global scope), and a
  // top-level `const stage` here collided with the renderer's own `const stage` — measured:
  // "Identifier 'stage' has already been declared", a blank page instead of a player.
  const art = document.getElementById('art');
  const msg = document.getElementById('msg');
  const home = document.getElementById('home');
  const stage = document.getElementById('stage');
  const fail = (text) => {
    msg.className = 'msg error';
    msg.textContent = text;
    home.innerHTML = '<a href="/bin2png">click me to go home</a>';
  };

  // ── 1. /file/<name> ─────────────────────────────────────────────────────────────────────────
  const asPath = location.pathname.match(/^\/file\/(.+)$/);
  // `jarivizero.github.io/<id>` — no `/file` in the path, and still a file address.
  const asRoot = !asPath && /^\/[A-Za-z0-9_-]{10,}(?:\.[A-Za-z0-9]+)?\/?$/.test(location.pathname);
  if (asPath || asRoot) {
    const name = (asPath ? asPath[1] : location.pathname.slice(1)).replace(/\/+$/, '');
    if (!name) { location.replace('/file'); return; }
    document.title = decodeURIComponent(name);
    // The player goes up in THIS document, before anything is fetched: a media name is a player
    // address, so the first paint is the black window with its controls — not "a blank page, then a
    // black page with no video load UI" (his 2026-10-19 report). The pre-paint above already decided
    // the kind from the same address, so the two can never disagree.
    if (window.__fileKind === 'media') {
      const v = document.createElement('video');
      v.controls = true;
      v.playsInline = true;
      v.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;' +
                        'object-fit:contain;background:#000';
      document.documentElement.style.background = '#000';
      document.body.style.cssText = 'margin:0;padding:0;background:#000';
      document.body.textContent = '';
      document.body.appendChild(v);
    }
    // Then the renderer takes THIS document over — same url, same document, no iframe to paint first.
    // It reads the name from the path, and its own pre-paint script keeps the window black.
    const root = location.pathname.slice(0, location.pathname.lastIndexOf('/file') + 1);
    try {
      const res = await fetch(root + 'file.html', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      document.open();
      document.write(await res.text());
      document.close();
      return;
    } catch (e) {
      // No renderer to write (offline, or a first deploy): fall back to framing it.
      const frame = document.createElement('iframe');
      frame.title = decodeURIComponent(name);
      frame.src = '/file#' + encodeURIComponent(name);
      frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#000';
      document.body.textContent = '';
      document.body.style.cssText = 'margin:0;padding:0;background:#000';
      document.body.appendChild(frame);
      return;
    }
  }
  if (location.pathname === '/file/') { location.replace('/file'); return; }

  // ── 2. a stream url opened cold ─────────────────────────────────────────────────────────────
  if (location.pathname.includes('/__b2p/')) {
    msg.className = 'msg';
    msg.textContent = 'Preparing the stream…';
    home.textContent = '';
    if (!('serviceWorker' in navigator) || !window.isSecureContext) {
      fail('This browser cannot install the worker the stream needs.');
      return;
    }
    try {
      // Absolute, on purpose: this page is served for the requested path, so a relative script url
      // would resolve against a directory that does not exist.
      await navigator.serviceWorker.register('/b2p-stream.js', { scope: '/' });
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller) {
        await new Promise((res) => {
          const t = setTimeout(res, 10000);
          navigator.serviceWorker.addEventListener('controllerchange', () => { clearTimeout(t); res(); }, { once: true });
        });
      }
      if (!navigator.serviceWorker.controller) {
        fail('The worker installed but did not take control of this page. Reload it once.');
        return;
      }
      // Two bytes prove the plan is reachable: 206 with them, or 410 when the address carries no
      // plan and this browser has never cached one.
      const probe = await fetch(location.href, { headers: { Range: 'bytes=0-1' }, cache: 'no-store' });
      if (probe.status === 206 || probe.status === 200) {
        msg.textContent = 'Stream ready — opening it.';
        location.replace(location.href);
        return;
      }
      if (probe.status === 410) {
        fail('This address carries no streaming plan, and this browser has not opened that file ' +
             'before. Open it from /file (or /bin2png) by its name first.');
        return;
      }
      fail(`The worker answered HTTP ${probe.status} for this address.`);
    } catch (e) {
      fail(`The worker could not be installed: ${e.message}`);
    }
    return;
  }

  // ── 3. an ordinary missing page: the art says it, so nothing else is added ──────────────────
  msg.textContent = '';
})();
</script>
</body>
</html>
